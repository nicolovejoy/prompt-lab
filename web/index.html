    // Cross-project 30-day activity — one stacked bar per day, colored by project.
    // `hide` is the set of projects the private toggle is currently hiding
    // (issue #23). They drop out of the chart entirely rather than being folded
    // into "other" — matching the activity stream, which drops them too. The
    // point of the toggle is that the name never appears on screen, and a
    // legend entry would defeat that.
    function CrossProjectActivity({ overview, hide }) {
      const narrow = useNarrow();
      // 7 | 30 only: this chart reads the `overview` payload, which is capped at
      // 30 days and deliberately kept lean because it's what paints the home
      // page. Longer windows are what #/activity is for, and the tile above
      // already links there — better than quietly widening overview's response.
      const [days, setDays] = useState(30);
      const all = overview.activity_by_project || {};
      const act = hide?.size
        ? Object.fromEntries(Object.entries(all).filter(([p]) => !hide.has(p)))
        : all;

      // Rank projects by total prompts; top 8 get colors, rest fold into "other".
      const totals = {};
      for (const p of Object.keys(act))
        totals[p] = (act[p] || []).reduce((s, d) => s + (d.prompts || 0), 0);
      const ranked = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      if (!ranked.length || ranked[0][1] === 0) return null;
      const colorOf = {};
      ranked.forEach(([p], i) => { colorOf[p] = i < COST_PALETTE.length ? COST_PALETTE[i] : COST_OTHER; });
      const namedSet = new Set(ranked.slice(0, COST_PALETTE.length).map(e => e[0]));
      const segColor = p => namedSet.has(p) ? colorOf[p] : COST_OTHER;

      // Per-day, per-project prompt counts + day totals.
      const byDateProject = {};
      for (const p of Object.keys(act))
        for (const d of act[p] || [])
          (byDateProject[d.date] ||= {})[p] = (byDateProject[d.date]?.[p] || 0) + (d.prompts || 0);

      const dates = [];
      for (let i = days - 1; i >= 0; i--)
        dates.push(labDay(i));

      return html`
        <div style="margin-bottom:26px; padding:16px; background:var(--card);
                    border:1px solid var(--border); border-radius:var(--radius)">
          <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px">
            <div style="font-family:'SF Mono',ui-monospace,monospace; font-size:0.93rem;
                        letter-spacing:0.14em; text-transform:uppercase; color:var(--text-secondary)">
              Activity · last ${days} days
            </div>
            <${WindowPicker} days=${days} onChange=${setDays} options=${[7, 30]} />
          </div>
          <div style="font-family:'SF Mono',ui-monospace,monospace; font-size:0.85rem;
                      color:var(--text-secondary); margin:-8px 0 10px">
            ${'prompts per day, stacked by project · tap a bar for '
              + (narrow ? 'its breakdown' : 'that day')}
          </div>
          <${PageNote} summary="About this chart">
            <div style="font-size:0.8rem; color:var(--text-secondary); margin:0 0 10px">
              Today (outlined) fills in as sessions are summarized — a session still
              running isn't counted yet.
            </div>
          <//>
          <div style="margin-bottom:12px">
            <${StackedBars} id="home" dates=${dates} days=${days} byDateSeg=${byDateProject}
              segColor=${segColor} fmtValue=${(v) => String(Math.round(v))} unit="prompts"
              chartH=${120} markToday=${true} gutter=${false} scroll=${false} todaySuffix=" so far" />
          </div>

          <div class="chart-legend">
            ${ranked.slice(0, COST_PALETTE.length).map(([p]) => html`
              <a class="tap" href=${'#/project/' + encodeURIComponent(p)}
                 style="display:inline-flex; align-items:center; gap:6px; text-decoration:none;
                        color:var(--text-secondary); font-size:0.98rem">
                <span style="width:8px; height:8px; border-radius:2px; background:${segColor(p)}"></span>${p}
              </a>`)}
            ${ranked.length > COST_PALETTE.length && html`
              <span style="display:inline-flex; align-items:center; gap:6px; font-size:0.98rem; color:var(--text-secondary)">
                <span style="width:8px; height:8px; border-radius:2px; background:${COST_OTHER}"></span>+${ranked.length - COST_PALETTE.length} more
              </span>`}
          </div>
        </div>`;
    }

    // ---- Home: cross-project activity stream ----
    function HomeView({ overview, role }) {
      const { week, by_project } = overview;
      const [expanded, setExpanded] = useState({});
      const [showDormant, setShowDormant] = useState(false);
      const [showPrivate, setShowPrivate] = useState(false);
      const [cost30, setCost30] = useState(() => costOverviewMemo.get(30)?.rows || null);
      const [views30, setViews30] = useState(() => visitorOverviewMemo.get(30)?.daily || null);

      useEffect(() => {
        const since = labDay(30);
        api('/api/cost_overview?since=' + since)
          .then(d => { costOverviewMemo.set(30, d); setCost30(d.rows || []); })
          .catch(() => setCost30([]));
        // Visitors is admin-only (decision 3) — a reader's request always
        // 403s, so skip the call entirely rather than eating a needless
        // failed fetch on every home load.
        if (role === 'admin') {
          api('/api/visitor_overview?since=' + since)
            .then(d => { visitorOverviewMemo.set(30, d); setViews30(d.daily || []); })
            .catch(() => setViews30([]));
        }
      }, [role]);
      const toggle = (id) => setExpanded(p => ({ ...p, [id]: !p[id] }));

      // `private` is a cosmetic hide-toggle (issue #23), not a confidentiality
      // control — the API returns these projects to any reader regardless.
      const pmeta = overview.project_metadata || {};
      const isPrivate = (p) => !!pmeta[p]?.private;
      const privateCount = (overview.all_projects || []).filter(isPrivate).length;
      const hidden = (p) => isPrivate(p) && !showPrivate;
      const hiddenSet = new Set((overview.all_projects || []).filter(hidden));

      // Flatten every project's daily summaries into one reverse-chron feed.
      const items = [];
      for (const p of Object.keys(by_project)) {
        if (hidden(p)) continue;
        for (const s of (by_project[p]?.summaries || [])) {
          items.push({ id: p + '-' + s.date, project: p, date: s.date, data: s,
                       phrase: distillPhrase(s), decisions: tryParseJson(s.key_decisions) });
        }
      }
      items.sort((a, b) => b.date.localeCompare(a.date) || a.project.localeCompare(b.project));

      // Stays "everything not in the stream" so a project can never fall
      // between the two lists and vanish from home entirely.
      const streamed = new Set(items.map(i => i.project));
      const dormantProjects = (overview.all_projects || [])
        .filter(p => !streamed.has(p) && !hidden(p)).sort();

      // Group by date for the timeline rail.
      const groups = [];
      let cur = null;
      for (const item of items) {
        if (item.date !== cur) { cur = item.date; groups.push({ date: cur, items: [] }); }
        groups[groups.length - 1].items.push(item);
      }

      const open = (p) => navigate('#/project/' + encodeURIComponent(p));

      return html`
        <${PulseTiles} overview=${overview} cost30=${cost30} views30=${views30} hide=${hiddenSet} role=${role} />
        <${CrossProjectActivity} overview=${overview} hide=${hiddenSet} />

        <div class="sec-label" style="font-family:'SF Mono',ui-monospace,monospace; font-size:0.93rem;
             letter-spacing:0.14em; text-transform:uppercase; color:var(--text-secondary);
             margin:0 0 12px">Recent activity</div>

        ${items.length === 0
          ? html`<div class="empty">No project activity in the last 7 days.</div>`
          : html`
            <div class="timeline">
              ${groups.map(g => html`
                <div class="timeline-date">${g.date}</div>
                ${g.items.map(item => {
                  const isOpen = expanded[item.id];
                  const s = item.data;
                  return html`
                    <div class="timeline-entry ${isPrivate(item.project) ? 'is-private' : ''}" onClick=${() => toggle(item.id)}>
                      <a class="stream-project" onClick=${(e) => { e.stopPropagation(); open(item.project); }}>${item.project}</a>
                      <span class="timeline-phrase" style="margin-left: 6px">${item.phrase}</span>
                      ${isOpen && html`
                        <div class="timeline-expand">
                          <div class="timeline-expand-summary">
                            <${MachineText}>${s.summary}<//>
                          </div>
                          ${item.decisions.length > 0 && html`
                            <ul class="timeline-expand-decisions">
                              ${item.decisions.map(d => html`<li>${d}</li>`)}
                            </ul>
                          `}
                          <div class="timeline-expand-counts">
                            <span><strong>${s.prompt_count || 0}</strong> prompts</span>
                            <span><strong>${s.session_count || 0}</strong> sessions</span>
                            <span><strong>${s.commit_count || 0}</strong> commits</span>
                          </div>
                        </div>
                      `}
                    </div>
                  `;
                })}
              `)}
            </div>
          `}

        ${dormantProjects.length > 0 && html`
          <div style="margin-top: 24px">
            <button class="tap" style="font-size: 1.16rem; color: var(--text-secondary); background: none;
              border: none; cursor: pointer; font-family: inherit; padding: 6px 0"
              onClick=${() => setShowDormant(!showDormant)}>
              ${showDormant ? 'Hide' : 'Show'} ${dormantProjects.length} dormant project${dormantProjects.length > 1 ? 's' : ''}
            </button>
            ${showDormant && html`
              <div class="dormant-list">
                ${dormantProjects.map(p => html`
                  <span class="dormant-chip ${isPrivate(p) ? 'is-private' : ''}" onClick=${() => open(p)}>${p}</span>
                `)}
              </div>
            `}
          </div>
        `}

        ${privateCount > 0 && html`
          <div style="margin-top: 8px">
            <button class="tap" style="font-size: 1.16rem; color: var(--text-secondary); background: none;
              border: none; cursor: pointer; font-family: inherit; padding: 6px 0"
              onClick=${() => setShowPrivate(v => !v)}>
              ${showPrivate ? 'Hide' : 'Show'} ${privateCount} private project${privateCount > 1 ? 's' : ''}
            </button>
          </div>
        `}
      `;
    }

    // ---- Activity Heatmap (GitHub-style, up to 12 months) ----
    function ActivityHeatmap({ activity }) {
      // The grid renders oldest-first (left) to today (right) inside a
      // horizontally-scrolling container; browsers default scrollLeft to 0,
      // so without this it opens showing a wall of blank past squares
      // instead of the recent activity. Scroll to the right edge on mount.
      const scrollRef = useRef(null);
      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollLeft = scrollRef.current.scrollWidth;
      }, [activity]);

      if (!activity?.length) return null;

      // Build a date->count map
      const byDate = {};
      for (const a of activity) byDate[a.date] = (a.prompt_count || 0);

      // Generate last 365 days grouped by week
      const today = new Date();
      const weeks = [];
      const monthLabels = [];
      let lastMonth = -1;

      // Start from the most recent Sunday
      const start = new Date(today);
      start.setDate(start.getDate() - 364);
      // Align to Sunday
      start.setDate(start.getDate() - start.getDay());

      let week = [];
      for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
        const ds = labDayOf(d);
        const count = byDate[ds] || 0;
        const level = count === 0 ? 0 : count <= 3 ? 1 : count <= 8 ? 2 : count <= 15 ? 3 : 4;
        week.push({ date: ds, level });

        // Track month labels (first week of each month)
        if (d.getMonth() !== lastMonth && d.getDay() === 0) {
          monthLabels.push({ idx: weeks.length, label: d.toLocaleDateString('en', { month: 'short' }) });
          lastMonth = d.getMonth();
        }

        if (d.getDay() === 6 || d.getTime() >= today.getTime()) {
          weeks.push(week);
          week = [];
        }
      }
      if (week.length) weeks.push(week);

      // idx -> label. monthLabels carried an `idx` from the start and the
      // renderer threw it away, which is why alignment was never right: the
      // labels were spread edge-to-edge across a container the grid never
      // filled. Now each label occupies the slot of the week it names.
      const labelAt = {};
      for (const m of monthLabels) labelAt[m.idx] = m.label;

      return html`
        <div>
          <div class="heatmap-scroll" ref=${scrollRef}>
            <div class="heatmap-track">
              <div class="heatmap-labels">
                ${weeks.map((_, i) => html`
                  <div class="heatmap-labelslot">
                    ${labelAt[i] ? html`
                      <span class="heatmap-labeltext">${labelAt[i]}</span>
                      <span class="heatmap-labeldot"></span>
                    ` : null}
                  </div>
                `)}
              </div>
              <div class="heatmap">
                ${weeks.map(w => html`
                  <div class="heatmap-month">
                    ${w.map(cell => html`
                      <div class="heatmap-cell heatmap-cell-${cell.level}" title="${cell.date}: ${byDate[cell.date] || 0} prompts"></div>
                    `)}
                  </div>
                `)}
              </div>
            </div>
          </div>
          <${PageNote} summary="About these counts">
            <div class="heatmap-note">
              Counts before ${CAPTURE_FIX_DAY} exclude prompts under 20
              characters, which the logger discarded at write time. Short prompts
              are mostly steering — "yes", "go ahead" — so supervision-heavy days
              are undercounted before that date and complete after it. The step is
              the fix, not a change in activity. Not backfillable: the dropped
              prompts were never stored.
            </div>
          <//>
        </div>
      `;
    }

    // ---- Todos (open GitHub issues across all your repos) ----
    let todosMemo = null;     // by-repo payload
    let todosCatMemo = null;  // categorized payload (by-type)

    // Type-of-work buckets — must mirror web/classify_helper.py's taxonomy.
    const CAT_ORDER = ['bug','feature','infra','ux','content','research','other','uncategorized'];
    const CAT_META = {
      bug:          { label: 'Bugs',            color: '#ef4444' },
      feature:      { label: 'Features',        color: '#6366f1' },
      infra:        { label: 'Infra & tooling', color: '#06b6d4' },
      ux:           { label: 'UX & polish',     color: '#ec4899' },
      content:      { label: 'Content & docs',  color: '#eab308' },
      research:     { label: 'Research',        color: '#a855f7' },
      other:        { label: 'Other',           color: '#777' },
      uncategorized:{ label: 'Uncategorized',   color: '#555' },
    };

    function TodosView({ overview }) {
      const [data, setData] = useState(todosMemo);
      const [loading, setLoading] = useState(!todosMemo);
      const [expanded, setExpanded] = useState({});  // project|cat -> bool
      const [showAll, setShowAll] = useState(false);  // tracked projects only vs every owned repo
      const [query, setQuery] = useState('');
      const [groupBy, setGroupBy] = useState('repo');  // 'repo' | 'type'
      const [catData, setCatData] = useState(todosCatMemo);
      const [catLoading, setCatLoading] = useState(false);

      useEffect(() => {
        if (todosMemo) { setData(todosMemo); setLoading(false); }
        let alive = true;
        api('/api/todos')
          .then(d => { todosMemo = d; if (alive) { setData(d); setLoading(false); } })
          .catch(e => { if (alive && !todosMemo) { setData({ error: e.message }); setLoading(false); } });
        return () => { alive = false; };
      }, []);

      // Lazily fetch the categorized payload the first time "by type" is shown.
      // If the server classified some but stragglers remain (pending>0), poll
      // again to classify the next capped batch until the backlog drains.
      useEffect(() => {
        if (groupBy !== 'type' || catData) return;
        let alive = true;
        setCatLoading(true);
        const load = () => api('/api/todos?categorize=1').then(d => {
          todosCatMemo = d;
          if (!alive) return;
          setCatData(d); setCatLoading(false);
          if (d.pending > 0 && d.classified_now > 0) setTimeout(load, 600);
        }).catch(() => { if (alive) setCatLoading(false); });
        load();
        return () => { alive = false; };
      }, [groupBy]);

      const reclassify = () => {
        setCatLoading(true);
        api('/api/todos?categorize=1&recategorize=1')
          .then(d => { todosCatMemo = d; setCatData(d); setCatLoading(false); })
          .catch(() => setCatLoading(false));
      };

      const header = html`
        <h1 style="margin: 0 0 4px; font-size: 1.91rem; color: var(--accent-light)">Todos</h1>
        <div style="font-size: 1.06rem; color: var(--text-secondary); margin-bottom: 16px">
          Open GitHub issues across your repos, grouped by project.
        </div>`;

      if (loading && !data) return html`<div>${header}<div class="cost-placeholder">Loading todos…</div></div>`;
      if (!data || data.error) return html`<div>${header}<div class="cost-placeholder">Couldn't load todos.${data?.error ? ' (' + data.error + ')' : ''}</div></div>`;
      if (data.configured === false) return html`<div>${header}
        <div class="cost-placeholder">
          GitHub isn't connected. Set a <code>GITHUB_TOKEN</code> (read access to issues)
          in the Vercel project env and redeploy.
        </div></div>`;

      const projects = data.projects || {};
      const allNames = Object.keys(projects).sort((a, b) =>
        projects[b].length - projects[a].length || a.localeCompare(b));
      if (!allNames.length) return html`<div>${header}
        <div class="empty">No open issues. 🎉</div></div>`;

      // Tracked = projects the dashboard knows about (canonical names). The
      // endpoint already folds repo→canonical, so these match. Null until the
      // overview loads, in which case nothing is hidden.
      const tracked = overview
        ? new Set([...(overview.all_projects || []), ...Object.keys(overview.by_project || {})])
        : null;
      const isTracked = (p) => !tracked || tracked.has(p);
      const hiddenNames = allNames.filter(p => !isTracked(p));
      const hiddenRepos = hiddenNames.length;
      const scoped = showAll ? allNames : allNames.filter(isTracked);

      // Search filters issues within the scoped repos by title / label /
      // #number / repo name.
      const q = query.trim().toLowerCase();
      const matches = (iss, p) => !q
        || (iss.title || '').toLowerCase().includes(q)
        || ('#' + iss.number).includes(q)
        || p.toLowerCase().includes(q)
        || (iss.labels || []).some(lb => lb.toLowerCase().includes(q));
      const filtered = scoped
        .map(p => ({ p, issues: projects[p].filter(iss => matches(iss, p)) }))
        .filter(x => x.issues.length > 0);

      const shownTotal = filtered.reduce((s, x) => s + x.issues.length, 0);

      const labelColor = (name) => {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) | 0;

    // <pure>
    // Pure helpers: no DOM, no Preact, nothing from outside this block.
    // scripts/test_frontend_pure.mjs lifts the block out by its markers and
    // unit-tests it under Node — the only way to test logic in a page that has
    // no build step. A reference to window, document or html in here fails
    // that run, which is what keeps the block honest.
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun',
                    'Jul','Aug','Sep','Oct','Nov','Dec'];
    function fmtShortDate(iso) {
      const [, m, d] = iso.split('-');
      return MONTHS[parseInt(m, 10) - 1] + ' ' + parseInt(d, 10);
    }
    function fmtMonth(ym) {
      const [y, m] = ym.split('-');
      return MONTHS[parseInt(m, 10) - 1] + ' ' + y;
    }
    // A month axis on a phone has ~20px per bucket; "Sep 2025" ran into its
    // neighbour, and a bare "Sep" can't tell this September from last.
    function fmtMonthShort(ym) {
      const [y, m] = ym.split('-');
      return MONTHS[parseInt(m, 10) - 1] + " '" + y.slice(2);
    }

    // Calendar arithmetic on YYYY-MM-DD strings. The strings are already
    // Pacific calendar days; Date.UTC on their parts keeps them that way.
    // Reading one back through a timezone is how a bucket slides a day.
    function addDays(iso, n) {
      const [y, m, d] = iso.split('-').map(Number);
      const t = new Date(Date.UTC(y, m - 1, d + n));
      const p = (v) => String(v).padStart(2, '0');
      return t.getUTCFullYear() + '-' + p(t.getUTCMonth() + 1) + '-' + p(t.getUTCDate());
    }
    // Monday-to-Sunday weeks, and a Monday is its own week — the same rule the
    // SQL rollups use ('weekday 0','-6 days'), so a phone bar and a weekly
    // rollup never disagree about which week a Monday belongs to.
    function mondayOf(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      const weekday = new Date(Date.UTC(y, m - 1, d)).getUTCDay();   // 0 = Sunday
      return addDays(iso, -((weekday + 6) % 7));
    }

    // A phone has room for about fifty bars. 90 days become weeks and a year
    // becomes months there; a wide screen keeps a bar per day at every window.
    function bucketSizeFor(days, narrow) {
      if (!narrow) return 'day';
      if (days >= 365) return 'month';
      if (days >= 90) return 'week';
      return 'day';
    }

    function bucketLabel(b) {
      const first = b.dates[0], last = b.dates[b.dates.length - 1];
      if (b.size === 'month') return fmtMonth(b.key);
      if (b.size === 'week' && first !== last) {
        return first.slice(0, 7) === last.slice(0, 7)
          ? fmtShortDate(first) + '–' + parseInt(last.slice(8), 10)
          : fmtShortDate(first) + ' – ' + fmtShortDate(last);
      }
      return fmtShortDate(first);
    }

    // `dates` ascending. The first and last bucket are usually partial: a
    // window rarely starts on a Monday or on the 1st.
    function bucketDates(dates, size) {
      const out = [];
      for (const d of dates) {
        const key = size === 'month' ? d.slice(0, 7) : size === 'week' ? mondayOf(d) : d;
        const last = out[out.length - 1];
        if (last && last.key === key) last.dates.push(d);
        else out.push({ key, size, dates: [d] });
      }
      for (const b of out) b.label = bucketLabel(b);
      return out;
    }

    // byDateSeg: { date: { segment: count } }. Counts may arrive as strings.
    function bucketTotals(bucket, byDateSeg) {
      const merged = {};
      for (const d of bucket.dates)
        for (const [s, v] of Object.entries(byDateSeg[d] || {}))
          merged[s] = (merged[s] || 0) + (Number(v) || 0);
      // Stable sort, so ties keep first-seen order: that is how every chart
      // stacked a day before buckets existed, and a single-day bucket must
      // paint exactly the same bar.
      const segs = Object.entries(merged).sort((a, b) => b[1] - a[1]);
      return { total: segs.reduce((t, [, v]) => t + v, 0), segs };
    }

    // Which bucket is under a pointer `x` pixels into a chart `width` wide.
    // Clamped, because a finger dragging across a chart slides off its edges.
    function bucketIndexAt(x, width, count) {
      if (!(width > 0) || count < 1) return -1;
      return Math.max(0, Math.min(count - 1, Math.floor((x / width) * count)));
    }

    // A money chart's y-axis labels. Wide: the labels the cost charts always
    // had, cents included and a bare "$0" at the baseline. Compact: a phone's
    // gutter is 44px, five monospace characters, so "$11.31" or a monthly
    // "$1,234.56" would spill out of it; cents go at $10, thousands become k.
    // The readout under the chart still shows the exact amount.
    function fmtUsdAxis(n, compact) {
      n = Number(n) || 0;
      if (n === 0) return '$0';
      if (!compact) {
        return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      if (n < 9.995) return '$' + n.toFixed(2);
      const whole = Math.round(n);
      if (whole < 1000) return '$' + whole;
      const k = n / 1000;
      return '$' + (k < 9.95 ? k.toFixed(1).replace(/\.0$/, '') : Math.round(k)) + 'k';
    }

    // A single project's daily spend is often under a cent; at two decimals a
    // real $0.004 day reads "$0.00", the same as no spend at all.
    function fmtUsdFine(n) {
      return '$' + (Number(n) || 0).toLocaleString('en-US',
        { minimumFractionDigits: 4, maximumFractionDigits: 4 });
    }

    // An uptime bucket takes its WORST day, not its average: averaging paints a
    // week with one bad day green, and a gap in the archive is missing data,
    // never 0% — so days without a reading are skipped, not counted as down.
    function bucketUptime(bucket, byDate) {
      const ups = [], mss = [];
      let days = 0;
      for (const d of bucket.dates) {
        const v = byDate[d];
        if (!v) continue;
        const up = v.uptime == null ? NaN : Number(v.uptime);
        const ms = v.ms == null ? NaN : Number(v.ms);
        if (Number.isFinite(up)) ups.push(up);
        if (Number.isFinite(ms)) mss.push(ms);
        if (Number.isFinite(up) || Number.isFinite(ms)) days++;
      }
      return {
        uptime: ups.length ? Math.min(...ups) : null,
        ms: mss.length ? mss.reduce((s, v) => s + v, 0) / mss.length : null,
        days,
      };
    }
    // </pure>

    // ---- Costs Overview (all projects, over time) ----
    const COST_PALETTE = ['#6366f1','#22c55e','#eab308','#ef4444','#06b6d4',
                          '#ec4899','#f97316','#a855f7'];
    const COST_OTHER = '#555';
    const costOverviewMemo = new Map();  // window(days) -> payload

    // Floating tooltips get clipped by the chart's scroll container on touch
    // devices (overflow-x: auto forces overflow-y: auto too) — gate the
    // hover tooltip to pointers that actually hover, and use tap-to-select
    // (a static panel below the chart) for touch instead.
    const CAN_HOVER = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

    function fmtUsd(n) {
      return '$' + (Number(n) || 0).toLocaleString('en-US',
        { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // ---- Shared date axis --------------------------------------------------
    // Six charts each carried their own copy of this: a flex row with one cell
    // per day, a hardcoded 6 ticks, and `white-space: nowrap` labels. At 30 days
    // on a 390px phone each cell is ~11px while a label needs ~50px, so labels
    // printed over each other ("Jul 17" landing inside "Jul 22") — and because
    // the overflowing text still counts toward an ancestor's scroll width, the
    // whole dashboard slid sideways and cut off its own headings.
    //
    // Two rules fix it for good, and both are why this is one component now:
    // the tick count is derived from the MEASURED width rather than a constant,
    // and the labels are absolutely positioned inside a clipped box, so no
    // label can ever contribute to the page's scroll width at any size.
    const TICK_PX = 64;   // room one "Jul 17" needs at 0.75rem mono, with air
    const AXIS_H = 18;

    function DateAxis({ dates, fmt = fmtShortDate, style = '' }) {
      const ref = useRef(null);
      const [w, setW] = useState(0);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const measure = () => setW(el.clientWidth);
        measure();
        if (typeof ResizeObserver === 'undefined') {
          window.addEventListener('resize', measure);
          return () => window.removeEventListener('resize', measure);
        }
        const ro = new ResizeObserver(measure);
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      const n = dates.length;
      const labels = `position:relative; height:${AXIS_H}px; overflow:hidden;
                      font-size:0.75rem; color:var(--text-secondary);
                      font-family:'SF Mono',ui-monospace,monospace`;
      if (!n) return html`<div ref=${ref} style=${style}></div>`;

      // w is 0 until the first measurement lands; show the two edges rather
      // than nothing, so the axis doesn't flash empty on first paint.
      const k = Math.max(2, Math.min(6, w ? Math.floor(w / TICK_PX) : 2, n));
      const idxs = [...new Set(
        Array.from({ length: k }, (_, i) => Math.round((i * (n - 1)) / (k - 1))))];

      // A label sits near its column, not over it — the end labels especially,
      // which pin to the edges. So each labelled column gets a dot at its true
      // centre, and the eye has something to draw the line with. Without it you
      // are counting bars to work out which day "Jul 17" means.
      const dot = i => html`
        <span style="position:absolute; top:0; left:${((i + 0.5) / n) * 100}%;
                     transform:translateX(-50%); width:3px; height:3px;
                     border-radius:50%; background:var(--text-secondary);
                     opacity:0.75"></span>`;

      return html`
        <div ref=${ref} style=${style}>
          <div style="position:relative; height:5px">${idxs.map(dot)}</div>
          <div style=${labels}>
          ${idxs.map(i => {
            // The end labels pin to the edges — a centered transform would push
            // half of each outside the clip, which is where they'd be lost.
            const pos = i === 0 ? 'left:0'
              : i === n - 1 ? 'right:0'
              : `left:${((i + 0.5) / n) * 100}%; transform:translateX(-50%)`;
            return html`<span style="position:absolute; top:0; ${pos};
                                     white-space:nowrap">${fmt(dates[i])}</span>`;
          })}
          </div>
        </div>`;
    }

    // ---- Shared stacked bar chart ------------------------------------------
    // Five charts carried their own copy of a daily stacked bar. On a phone a
    // 90-day or 1-year window scrolled sideways through up to ten panel widths,
    // each bar was a 5px target, and the per-day breakdown lived in a hover
    // tooltip a finger never raises. This one buckets days into weeks or months
    // when the screen is narrow, lets a thumb select a bar, and prints the
    // selection under the chart. A wide screen gets exactly the old chart.
    const NARROW_QUERY = '(max-width: 640px)';

    // rotation re-buckets the chart instead of leaving it laid out for the
    // old width.
    function useNarrow() {
      const [narrow, setNarrow] = useState(() => window.matchMedia(NARROW_QUERY).matches);
      useEffect(() => {

        const update = () => setNarrow(mq.matches);
        update();
        // Safari before 14 only has the deprecated addListener.
        if (mq.addEventListener) {
          mq.addEventListener('change', update);
          return () => mq.removeEventListener('change', update);
        }
        mq.addListener(update);
        return () => mq.removeListener(update);

      return narrow;

    // will do. A week's full label ("Jul 28 – Aug 3") and a month's
    // ("Sep 2025") are too wide for a phone axis and live in the readout.
    function axisLabel(b) {

        : b.size === 'month' ? fmtMonthShort(b.key) : b.label;
    }

    // How a bar chart's bars are selected, shared by every chart that has a
    // readout, so a thumb gets the same rules on each of them. The caller
    // puts rowRef and the pointer handlers on the row of bars, and
    // onBarClick(e, i) on each bar.
    //
    // A selection is an index, and an index means a different bucket once the
    // window or the bucket size changes. It carries the layout it was made in
    // and reads as nothing under any other, so the first render after a
    // change never draws it against the new buckets; the effect then drops
    // it, so returning to the old layout (rotating back, or a cached window
    // that keeps this chart mounted) does not bring it back.
    function useBarSelection(layout, buckets) {
      const [picked, setPicked] = useState(null);
      const selected = picked && picked.layout === layout ? picked.i : null;
      useEffect(() => { setPicked((p) => (p && p.layout !== layout ? null : p)); }, [layout]);
      const select = (i) => { if (i >= 0) setPicked({ layout, i }); };
      const rowRef = useRef(null);
      const gesture = useRef(null);
      const lastTouch = useRef(-Infinity);

      // pointerType, because a hover media query says what the device CAN do,
      // not what just touched it.
      const isFinger = (e) => e.pointerType === 'touch' || e.pointerType === 'pen';
      const indexAt = (clientX) => {
        const r = rowRef.current.getBoundingClientRect();
        return bucketIndexAt(clientX - r.left, r.width, buckets.length);
      };
      const onPointerDown = (e) => {
        if (!isFinger(e)) return;
        lastTouch.current = e.timeStamp;
        gesture.current = { id: e.pointerId, y: e.clientY };

      };

      // vertically is the page scrolling, and the selection stays where it was
      // for the rest of that gesture.
      const onPointerMove = (e) => {
        const g = gesture.current;
        if (!g || g.id !== e.pointerId) return;
        if (Math.abs(e.clientY - g.y) > 10) { gesture.current = null; return; }
        select(indexAt(e.clientX));

      const onBarClick = (e, i) => {
