        // day page opening under the thumb is exactly what the readout avoids.
        if (isFinger(e) || e.timeStamp - lastTouch.current < 1000) return;
        const b = buckets[i];
        if (b.size === 'day' && CAN_HOVER) navigate('#/day/' + b.key);
        else select(i);
      };
      return { selected, rowRef, onPointerDown, onPointerMove, endGesture, onBarClick };
    }

    // The props after markToday exist for particular charts, and each default
    // leaves every other chart as it was:
    //   gutter      false drops the y-axis (the home chart never had one).
    //   scroll      false drops the wide chart's sideways scroller, for a chart
    //               whose window is never longer than 30 days: its bars always
    //               fit, and outside a scroller its tooltip is not clipped.
    //   fmtAxis     (value, narrow) -> gutter label, for money that needs
    //               shorter labels on a phone than in the readout.
    //   minPeak     the smallest full-height value; a cost chart's is a
    //               fraction of a cent, so a quiet month still fills the chart.
    //   tailSeg     the segment a caller folds its tail into ("other"): it
    //               stacks on top and lists last whatever its size.
    //   todaySuffix appended to today's heading while today is still counting.
    function StackedBars({ id, dates, days, byDateSeg, segColor, fmtValue = (n) => Math.round(n).toLocaleString(),
                           unit = '', chartH = 140, markToday = false, gutter = true, scroll = true, fmtAxis = fmtValue,
                           minPeak = 1, tailSeg = null, todaySuffix = '' }) {
      const narrow = useNarrow();
      const [hovered, setHovered] = useState(null);
      const layout = days + '|' + dates.length + '|' + narrow;
      const scrollRef = useRef(null);

      const size = bucketSizeFor(days, narrow);
      const buckets = bucketDates(dates, size);
      const { selected, rowRef, onPointerDown, onPointerMove, endGesture, onBarClick } =
        useBarSelection(layout, buckets);
      const totals = buckets.map((b) => {
        const t = bucketTotals(b, byDateSeg);
        const tail = tailSeg == null ? -1 : t.segs.findIndex(([s]) => s === tailSeg);
        if (tail >= 0) t.segs.push(...t.segs.splice(tail, 1));
        return t;
      });
      const peak = Math.max(...totals.map((t) => t.total), minPeak);
      const n = buckets.length;
      const today = dates[dates.length - 1];
      // Parts, not one joined string: each renders as its own text node, as the
      // old tooltips did. Joined, the home tooltip came out 0.03px narrower and
      // every glyph under its heading moved.
      const heading = (b, total) => [b.label, ' · ', fmtValue(total), unit ? ' ' + unit : '',
        b.size === 'day' && b.key === today ? todaySuffix : ''];
      const label = {};
      for (const b of buckets) label[b.key] = axisLabel(b);

      // The wide chart opens at its newest day, as every chart here always has.
      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollLeft = scrollRef.current.scrollWidth;
      }, [layout, dates[dates.length - 1]]);

      const bars = buckets.map((b, i) => {
        const { total, segs } = totals[i];
        const barH = total > 0 ? Math.max(1, Math.round((total / peak) * (chartH - 4))) : 0;
        const isHovered = hovered === i;
        const opacity = selected != null ? (selected === i ? 1 : 0.45) : (isHovered ? 1 : 0.85);
        const edge = n > 1 ? i / (n - 1) : 0.5;
        const tipAnchor = edge < 0.15 ? 'left: 0' : edge > 0.85 ? 'right: 0' : 'left: 50%; transform: translateX(-50%)';
        const isToday = markToday && size === 'day' && i === n - 1;
        return html`
          <div data-test="chart-bar" data-key=${b.key} data-selected=${selected === i ? 'true' : undefined}
               style="flex: 1; min-width: 3px; height: 100%; position: relative; cursor: pointer"
               onPointerEnter=${(e) => { prefetchDay(b.dates[b.dates.length - 1]); if (e.pointerType === 'mouse') setHovered(i); }}
               onPointerLeave=${() => setHovered((h2) => (h2 === i ? null : h2))}
               onClick=${(e) => onBarClick(e, i)}>
            ${isToday && html`
              <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 0;
                          border: 1px dashed var(--border); border-bottom: none;
                          border-radius: 2px 2px 0 0; pointer-events: none"></div>`}
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: ${barH}px;
                        display: flex; flex-direction: column-reverse;
                        border-radius: 2px 2px 0 0; overflow: hidden;
                        opacity: ${opacity}; transition: opacity 0.1s">
              ${segs.map(([s, v]) => html`
                <div style="height: ${(v / total) * 100}%; background: ${segColor(s)}"></div>`)}
            </div>
            ${CAN_HOVER && isHovered && total > 0 && html`
              <div style="position: absolute; bottom: 100%; z-index: 5; margin-bottom: 4px; ${tipAnchor};
                          background: var(--bg); border: 1px solid var(--border);
                          border-radius: 6px; padding: 8px 10px; white-space: nowrap;
                          box-shadow: 0 4px 16px rgba(0,0,0,0.4); font-size: 0.95rem">
                <div style="font-weight: 600; margin-bottom: 4px">${heading(b, total)}</div>
                ${segs.slice(0, 6).map(([s, v]) => html`
                  <div style="display: flex; align-items: center; gap: 6px; color: var(--text-secondary)">
                    <span style="width: 8px; height: 8px; border-radius: 2px; background: ${segColor(s)}; display: inline-block"></span>
                    <span style="color: var(--text)">${s}</span>
                    <span style="margin-left: auto">${fmtValue(v)}</span>
                  </div>`)}
                ${segs.length > 6 && html`<div style="color: var(--text-secondary)">+${segs.length - 6} more</div>`}
              </div>`}
          </div>`;
      });

      const row = html`
        <div data-test="chart-bars" ref=${rowRef} class=${narrow ? 'chart-bars narrow' : 'chart-bars'}
             style="display: flex; gap: 2px; align-items: stretch; height: ${chartH}px;
                    border-bottom: 1px solid var(--border)"
             onPointerDown=${onPointerDown} onPointerMove=${onPointerMove}
             onPointerUp=${endGesture} onPointerCancel=${endGesture}>
          ${bars}
        </div>`;
      const axis = html`<${DateAxis} dates=${buckets.map((b) => b.key)} fmt=${(k) => label[k]}
                                     style="margin-top: 4px" />`;
      const sel = selected != null ? buckets[selected] : null;

      const plot = narrow || !scroll
        ? html`<div>${row}${axis}</div>`
        : html`
          <div class="chart-scroll" ref=${scrollRef}>
            <div style="min-width: ${n * 7}px">${row}${axis}</div>
          </div>`;

      return html`
        <div data-test="chart" data-chart=${id}>
          ${gutter ? html`
            <div style="display: grid; grid-template-columns: ${narrow ? 44 : 56}px minmax(0, 1fr); gap: 8px">
              <div style="display: flex; flex-direction: column; justify-content: space-between;
                          align-items: flex-end; height: ${chartH}px; font-size: 0.85rem;
                          color: var(--text-secondary); ${MONO}">
                <span>${fmtAxis(peak, narrow)}</span>
                <span>${fmtAxis(peak / 2, narrow)}</span>
                <span>${fmtAxis(0, narrow)}</span>
              </div>
              ${plot}
            </div>` : plot}
          ${sel && html`<${ChartReadout} bucket=${sel} heading=${heading(sel, totals[selected].total)}
                          segs=${totals[selected].segs} segColor=${segColor} fmtValue=${fmtValue}
                          byDateTotal=${(d) => bucketTotals({ dates: [d] }, byDateSeg).total} />`}
        </div>`;
    }

    // What a hover tooltip used to say, in page flow under the chart, plus the
    // way into the day(s) behind the bar. In flow, not floating: a floating box
    // is clipped by the chart's own panel on a phone and covers what it explains.
    // `body`, when given, replaces the segment rows: a chart whose bucket is not
    // a sum of segments (the uptime strip) says what it has to say there, and
    // keeps the same heading and the same way into its days.
    const READOUT_SEGS = 6;
    function ChartReadout({ bucket, heading, segs, segColor, fmtValue = (n) => Math.round(n).toLocaleString(),
                            byDateTotal, body = null }) {
      return html`
        <div data-test="chart-readout" class="chart-readout">
          <div class="chart-readout-head">${heading}</div>
          ${body || (segs.length
            ? html`
              ${segs.slice(0, READOUT_SEGS).map(([s, v]) => html`
                <div class="chart-readout-row">
                  <span class="chart-readout-swatch" style="background: ${segColor(s)}"></span>
                  <span class="chart-readout-name">${s}</span>
                  <span class="chart-readout-value">${fmtValue(v)}</span>
                </div>`)}
              ${segs.length > READOUT_SEGS && html`
                <div class="chart-readout-more">+${segs.length - READOUT_SEGS} more</div>`}`
            : html`<div class="chart-readout-more">Nothing recorded.</div>`)}
          ${bucket.size === 'day'
            ? html`
              <button class="chart-open-day" data-test="open-day"
                      onClick=${() => navigate('#/day/' + bucket.key)}>Open day →</button>`
            : html`
              <div class="chart-day-chips">
                ${bucket.dates.map((d) => html`
                  <button class="chart-day-chip" data-test="day-chip" data-date=${d}
                          aria-label=${fmtShortDate(d)}
                          style=${byDateTotal(d) > 0 ? '' : 'opacity: 0.45'}
                          onPointerEnter=${() => prefetchDay(d)}
                          onClick=${() => navigate('#/day/' + d)}>${parseInt(d.slice(8), 10)}</button>`)}
              </div>`}
        </div>`;
    }

    function CostsOverview() {
      const [days, setDays] = useState(30);
      const [data, setData] = useState(() => costOverviewMemo.get(30) || null);
      const [loading, setLoading] = useState(!costOverviewMemo.has(30));
      const [sortBy, setSortBy] = useState('cost');  // 'cost' | 'name'

      useEffect(() => {
        const cached = costOverviewMemo.get(days);
        if (cached) { setData(cached); setLoading(false); }
        else { setData(null); setLoading(true); }
        const since = labDay(days);
        let alive = true;
        api('/api/cost_overview?since=' + since)
          .then(d => { costOverviewMemo.set(days, d); if (alive) { setData(d); setLoading(false); } })
          .catch(e => { if (alive && !cached) { setData({ error: e.message }); setLoading(false); } });
        return () => { alive = false; };
      }, [days]);

      const header = html`
        <div style="display: flex; justify-content: space-between; align-items: baseline;
                    flex-wrap: wrap; gap: 12px; margin-bottom: 4px">
          <h1 style="margin: 0; font-size: 1.91rem; color: var(--accent-light)">Costs</h1>
          <${WindowPicker} days=${days} onChange=${setDays} />
        </div>
        <${PageNote}>
          <div style="font-size: 1.06rem; color: var(--text-secondary); margin-bottom: 20px">
            API spend across all projects. Claude Code (subscription) usage isn't
            attributable per project, so subscription-only projects read $0 here —
            these totals are API spend, not all spend.
          </div>
        <//>`;

      if (loading && !data) return html`<div>${header}<div class="cost-placeholder">Loading costs…</div></div>`;
      if (!data || data.error) return html`<div>${header}<div class="cost-placeholder">Couldn't load costs.</div></div>`;

      const rows = data.rows || [];
      if (!rows.length) return html`<div>${header}
        <div class="cost-placeholder">No API spend in this window.</div></div>`;

      // Aggregate.
      const byProject = {}, byModel = {}, byDateProject = {};
      for (const r of rows) {
        const v = Number(r.cost_usd) || 0;
        byProject[r.project] = (byProject[r.project] || 0) + v;
        byModel[r.model] = (byModel[r.model] || 0) + v;
        (byDateProject[r.date] ||= {})[r.project] =
          (byDateProject[r.date]?.[r.project] || 0) + v;
      }
      const total = Object.values(byProject).reduce((s, v) => s + v, 0);

      // Rank projects by spend; top 8 get colors, the rest fold into "other".
      const ranked = Object.entries(byProject).sort((a, b) => b[1] - a[1]);
      const colorOf = {};
      ranked.forEach(([p], i) => { colorOf[p] = i < COST_PALETTE.length ? COST_PALETTE[i] : COST_OTHER; });
      const namedProjects = ranked.slice(0, COST_PALETTE.length).map(e => e[0]);
      const namedSet = new Set(namedProjects);
      const hasOther = ranked.length > COST_PALETTE.length;
      const segColor = (p) => namedSet.has(p) ? colorOf[p] : COST_OTHER;

      // Continuous calendar axis: one bar per day in the window (zero-filled),
      // so a window with only a few spend-days still renders thin, evenly-spaced
      // bars instead of two giant ones.
      const dates = [];
      for (let i = days - 1; i >= 0; i--) {
        dates.push(labDay(i));
      }

      // Legend rows (sortable).
      const legend = [...ranked];
      if (sortBy === 'name') legend.sort((a, b) => a[0].localeCompare(b[0]));

      const models = Object.entries(byModel).sort((a, b) => b[1] - a[1]);
      const maxProj = ranked[0]?.[1] || 1;

      const panel = (children) => html`
        <div style="margin-top: 16px; padding: 14px; background: var(--bg-elevated, var(--card));
                    border: 1px solid var(--border); border-radius: 6px">${children}</div>`;

      return html`
        <div>
          ${header}

          <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px">
            <div style="font-size: 2.18rem; font-weight: 700; color: var(--accent-light)">${fmtUsd(total)}</div>
            <div style="font-size: 1.06rem; color: var(--text-secondary)">
              total · last ${days === 365 ? 'year' : days + ' days'}
            </div>
          </div>

          ${panel(html`
            <${StackedBars} id="costs" dates=${dates} days=${days} byDateSeg=${byDateProject}
              segColor=${segColor} fmtValue=${fmtUsd} fmtAxis=${fmtUsdAxis} minPeak=${0.0001} />
          `)}

          <div class="two-col">
            <div>
              <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px">
                <div style="font-size: 0.98rem; font-weight: 600; color: var(--text-secondary);
                            font-family: 'SF Mono', ui-monospace, monospace; text-transform: uppercase">
                  By project
                </div>
                <button class="tap" onClick=${() => setSortBy(s => s === 'cost' ? 'name' : 'cost')}
                  style="font-size: 0.9rem; color: var(--accent); background: none; border: none;
                         cursor: pointer; font-family: inherit">
                  sort: ${sortBy} ↕
                </button>
              </div>
              ${legend.map(([p, v]) => html`
                <a href="#/project/${encodeURIComponent(p)}/cost"
                   class="row-link">
                  <div style="display: flex; align-items: center; gap: 8px">
                    <span style="width: 9px; height: 9px; border-radius: 2px; background: ${segColor(p)}; flex: none"></span>
                    <span style="font-size: 1.12rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${p}</span>
                    <span style="margin-left: auto; font-size: 0.85rem; color: var(--text-secondary)">${(v / total * 100).toFixed(0)}%</span>
                    <span style="font-size: 1.12rem; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right">${fmtUsd(v)}</span>
                  </div>
                  <div style="height: 3px; border-radius: 2px; margin-top: 3px;
                              width: ${(v / maxProj * 100).toFixed(1)}%;
                              background: ${segColor(p)}; opacity: 0.6"></div>
                </a>`)}
              ${hasOther && html`
                <div style="font-size: 0.85rem; color: var(--text-secondary); padding-top: 6px">
                  ${ranked.length - COST_PALETTE.length} smaller projects share the “other” color.
                </div>`}
            </div>

            <div>
              <div style="font-size: 0.98rem; font-weight: 600; color: var(--text-secondary);
                          font-family: 'SF Mono', ui-monospace, monospace; text-transform: uppercase; margin-bottom: 8px">
                By model
              </div>
              ${models.map(([m, v]) => html`
                <div style="display: flex; align-items: center; gap: 8px; padding: 5px 0;
                            border-bottom: 1px solid var(--border)">
                  <span style="font-size: 1.12rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${m}</span>
                  <span style="margin-left: auto; font-size: 0.85rem; color: var(--text-secondary)">${(v / total * 100).toFixed(0)}%</span>
                  <span style="font-size: 1.12rem; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right">${fmtUsd(v)}</span>
                </div>`)}
            </div>
          </div>
        </div>`;
    }

    // ---- Activity Overview (all projects: sessions / prompts / commits over time) ----
    // Mirrors #/costs: one fetch per window, stacked-by-project daily chart on a
    // zero-filled calendar axis, sortable per-project table. The metric switch
    // is client-side off the same rows — every row carries all three counts.
    const activityTimelineMemo = new Map();  // window(days) -> payload

    // Top-N cap on the stack. 365d returns ~70 projects (incl. pre-hook-fix junk
    // names); anything past N folds into one muted "other" band so the legend
    // stays readable. N matches COST_PALETTE's length, which is the cap #/costs
    // already used for its own colors — same grammar, same 8 colors. Nothing is
    // filtered out: the per-project table below still lists every project, so
    // the chart's "other" band always reconciles against it.
    const ACTIVITY_TOP_N = COST_PALETTE.length;

    function fmtInt(n) { return (Number(n) || 0).toLocaleString('en-US'); }

    function ActivityOverview({ metric }) {
      const m = ACTIVITY_METRICS.includes(metric) ? metric : 'sessions';
      const [days, setDays] = useState(30);
      const [data, setData] = useState(() => activityTimelineMemo.get(30) || null);
      const [loading, setLoading] = useState(!activityTimelineMemo.has(30));
      const [sortBy, setSortBy] = useState('30d');   // '30d' | '7d' | 'name'

      useEffect(() => {
        const cached = activityTimelineMemo.get(days);
        if (cached) { setData(cached); setLoading(false); }
        else { setData(null); setLoading(true); }
        let alive = true;
        api('/api/activity_timeline?days=' + days)
          .then(d => { activityTimelineMemo.set(days, d); if (alive) { setData(d); setLoading(false); } })
          .catch(e => { if (alive && !cached) { setData({ error: e.message }); setLoading(false); } });
        return () => { alive = false; };
      }, [days]);

      const windowLabel = (d) => (d === 365 ? 'year' : d + ' days');

      // Metric switch writes the hash, so the current view is always shareable
      // and the Pulse tiles' #/activity/<metric> deep links round-trip.
      const metricSwitch = html`
        <div class="sub-tabs" style="display: inline-flex; margin-bottom: 16px">
          ${ACTIVITY_METRICS.map(k => html`
            <button class="sub-tab ${k === m ? 'active' : ''}"
                    onClick=${() => navigate('#/activity/' + k)}>${k}</button>`)}
        </div>`;

      const header = html`
        <div style="display: flex; justify-content: space-between; align-items: baseline;
                    flex-wrap: wrap; gap: 12px; margin-bottom: 4px">
          <h1 style="margin: 0; font-size: 1.91rem; color: var(--accent-light)">Activity</h1>
          <${WindowPicker} days=${days} onChange=${setDays} />
        </div>
        <${PageNote}>
          <div style="font-size: 1.06rem; color: var(--text-secondary); margin-bottom: 16px">
            Sessions, prompts and commits per day across every project, from the
            nightly daily summaries. Counts follow project renames (aliases are
            folded into the canonical name).
          </div>
        <//>
        ${metricSwitch}`;

      if (loading && !data) return html`<div>${header}<div class="cost-placeholder">Loading activity…</div></div>`;
      if (!data || data.error) return html`<div>${header}<div class="cost-placeholder">Couldn't load activity.</div></div>`;

      // The endpoint echoes the window it actually served (it clamps), so label
      // and zero-fill from that rather than from what we asked for.
      const effDays = Number(data.days) > 0 ? Number(data.days) : days;
      const rows = Array.isArray(data.rows) ? data.rows : [];

      const val = (r) => Number(r[m]) || 0;

      // Aggregate the selected metric.
      const byProject = {}, byDateProject = {};
      const totals = { sessions: 0, prompts: 0, commits: 0 };
      const day = (i) => labDay(i);
      const cut7 = day(6), cut30 = day(29);
      const per7 = {}, per30 = {};
      for (const r of rows) {
        const v = val(r);
        for (const k of ACTIVITY_METRICS) totals[k] += Number(r[k]) || 0;
        byProject[r.project] = (byProject[r.project] || 0) + v;
        (byDateProject[r.date] ||= {})[r.project] = (byDateProject[r.date]?.[r.project] || 0) + v;
        if (r.date >= cut7) per7[r.project] = (per7[r.project] || 0) + v;
        if (r.date >= cut30) per30[r.project] = (per30[r.project] || 0) + v;
      }
      const total = totals[m];

      // Rank by the selected metric; the top N get colors, the tail folds into
      // one "other" band. Zero-metric projects never take a palette slot.
      const ranked = Object.entries(byProject)
        .filter(([, v]) => v > 0)
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      const named = ranked.slice(0, ACTIVITY_TOP_N).map(e => e[0]);
      const namedSet = new Set(named);
      const colorOf = {};
      named.forEach((p, i) => { colorOf[p] = COST_PALETTE[i]; });
      const otherCount = Math.max(0, ranked.length - named.length);
      const otherLabel = 'other · ' + otherCount + ' project' + (otherCount === 1 ? '' : 's');
      const segColor = (p) => colorOf[p] || COST_OTHER;

      // One stack per day: named projects individually, the rest summed into
      // `otherLabel` so a 70-project window still renders a legible bar.
      const segsFor = (d) => {
        const per = byDateProject[d] || {};
        const out = [];
        let other = 0;
        for (const [p, v] of Object.entries(per)) {
          if (v <= 0) continue;
          if (namedSet.has(p)) out.push([p, v]); else other += v;
        }
        out.sort((a, b) => b[1] - a[1]);
        if (other > 0) out.push([otherLabel, other]);
        return out;
      };

      if (!rows.length || total === 0) return html`<div>${header}
        <div class="cost-placeholder">No ${m} recorded in the last ${windowLabel(effDays)}.</div></div>`;

      // Continuous calendar axis: one slot per day in the window, zero-filled,
      // so a sparse window still reads as a calendar rather than a few fat bars.
      const dates = [];
      for (let i = effDays - 1; i >= 0; i--) dates.push(day(i));
      const byDateSeg = {};
      for (const d of dates) byDateSeg[d] = Object.fromEntries(segsFor(d));

      // Table rows: every project the window saw, sortable. 7d/30d are fixed
      // windows (not the chart window) so the columns mean the same thing at
      // every zoom level and line up with the Pulse tiles' "· 7d" numbers.
      const table = ranked.map(([p, v]) => ({ p, v, w7: per7[p] || 0, w30: per30[p] || 0 }));
      if (sortBy === 'name') table.sort((a, b) => a.p.localeCompare(b.p));
      else if (sortBy === '7d') table.sort((a, b) => b.w7 - a.w7 || a.p.localeCompare(b.p));
      else table.sort((a, b) => b.w30 - a.w30 || a.p.localeCompare(b.p));
      const maxProj = ranked[0]?.[1] || 1;
      const nextSort = { '30d': '7d', '7d': 'name', name: '30d' };

      const panel = (children) => html`
        <div style="margin-top: 16px; padding: 14px; background: var(--bg-elevated, var(--card));
                    border: 1px solid var(--border); border-radius: 6px">${children}</div>`;

      return html`
        <div>
          ${header}

          <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; flex-wrap: wrap">
            <div style="font-size: 2.18rem; font-weight: 700; color: var(--accent-light)">${fmtInt(total)}</div>
            <div style="font-size: 1.06rem; color: var(--text-secondary)">
              ${m} · last ${windowLabel(effDays)} · ${ranked.length} project${ranked.length === 1 ? '' : 's'}
            </div>
          </div>

          ${panel(html`
            <${StackedBars} id="activity" dates=${dates} days=${effDays} byDateSeg=${byDateSeg}
              segColor=${segColor} fmtValue=${(v) => fmtInt(Math.round(v))} unit=${m} tailSeg=${otherLabel} />
          `)}

          <div class="two-col">
            <div>
              <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px">
                <div style="font-size: 0.98rem; font-weight: 600; color: var(--text-secondary);
                            font-family: 'SF Mono', ui-monospace, monospace; text-transform: uppercase">
                  By project
                </div>
                <button class="tap" onClick=${() => setSortBy(s => nextSort[s] || '30d')}
                  style="font-size: 0.9rem; color: var(--accent); background: none; border: none;
                         cursor: pointer; font-family: inherit">
                  sort: ${sortBy} ↕
                </button>
              </div>
              <div style="display: flex; gap: 8px; font-size: 0.85rem; color: var(--text-secondary);
                          font-family: 'SF Mono', ui-monospace, monospace; padding-bottom: 4px">
                <span style="margin-left: auto; min-width: 56px; text-align: right">7d</span>
                <span style="min-width: 56px; text-align: right">30d</span>
              </div>
              ${table.map(row => html`
                <a href="#/project/${encodeURIComponent(row.p)}"
                   class="row-link">
                  <div style="display: flex; align-items: center; gap: 8px">
                    <span style="width: 9px; height: 9px; border-radius: 2px; background: ${segColor(row.p)}; flex: none"></span>
                    <span style="font-size: 1.12rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${row.p}</span>
                    <span style="margin-left: auto; font-size: 1.12rem; font-variant-numeric: tabular-nums;
                                 min-width: 56px; text-align: right">${fmtInt(row.w7)}</span>
                    <span style="font-size: 1.12rem; font-variant-numeric: tabular-nums;
                                 min-width: 56px; text-align: right">${fmtInt(row.w30)}</span>
                  </div>
                  <div style="height: 3px; border-radius: 2px; margin-top: 3px;
                              width: ${(row.v / maxProj * 100).toFixed(1)}%;
                              background: ${segColor(row.p)}; opacity: 0.6"></div>
                </a>`)}
              <div style="font-size: 0.85rem; color: var(--text-secondary); padding-top: 6px; line-height: 1.5">
                Bar is each project's share of the last ${windowLabel(effDays)};
                the 7d / 30d columns are fixed windows, so they don't change with the zoom.
                ${otherCount > 0 && html`<span> The chart stacks the top ${ACTIVITY_TOP_N}; the
                  other ${otherCount} (grey swatch) fold into one band — every project is
                  still listed here, so the band always reconciles.</span>`}
              </div>
            </div>

            <div>
              <div style="font-size: 0.98rem; font-weight: 600; color: var(--text-secondary);
                          font-family: 'SF Mono', ui-monospace, monospace; text-transform: uppercase; margin-bottom: 8px">
                Window totals
              </div>
              ${ACTIVITY_METRICS.map(k => html`
                <a class="tap" href=${'#/activity/' + k}
                   style="display: flex; align-items: center; gap: 8px; padding: 5px 0;
                          text-decoration: none; border-bottom: 1px solid var(--border);
                          color: ${k === m ? 'var(--accent-light)' : 'var(--text)'}">
                  <span style="font-size: 1.12rem; font-weight: ${k === m ? 600 : 400}">${k}</span>
                  ${k === m && html`<span style="font-size: 0.85rem; color: var(--text-secondary)">shown</span>`}
                  <span style="margin-left: auto; font-size: 1.12rem; font-variant-numeric: tabular-nums;
                               min-width: 64px; text-align: right">${fmtInt(totals[k])}</span>
                </a>`)}
              <div style="font-size: 0.85rem; color: var(--text-secondary); padding-top: 6px; line-height: 1.5">
                All three over the last ${windowLabel(effDays)} — one fetch, so
                switching metric is instant.
              </div>
            </div>
          </div>
        </div>`;
    }

    // ---- Visitors Overview (all sites, page views over time) ----
    const visitorOverviewMemo = new Map();  // window(days) -> payload

    // ---- About (#/about) ----
    // Ask was mothballed out of the nav 2026-08-05 — it was the only action in a
    // panel of destinations and settings, and went unused. Endpoint and modal are
    // untouched; this page and the "/" shortcut are how you reach it now.
    function AboutView({ info, onAsk }) {
      const row = (label, value, cls) => html`
        <div style="display:flex; gap:12px; padding:6px 0; border-bottom:1px solid var(--border)">
          <span style="color:var(--text-secondary)">${label}</span>
          <span class=${cls || ''} style="margin-left:auto; font-family:'SF Mono',ui-monospace,monospace;
                       font-size:0.88rem; text-align:right">${value}</span>
        </div>`;

      let built = '—';
      if (info?.build_time) {
        try {
          built = new Intl.DateTimeFormat('en-US', {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
            hour12: false, timeZone: LAB_TZ, timeZoneName: 'short',
          }).format(new Date(info.build_time));
        } catch { built = info.build_time; }
      }

      return html`
        <div style="max-width:640px">
          <h1 style="margin:0 0 12px; font-size:1.7rem; color:var(--accent-light)">About</h1>
          <p style="line-height:1.55; margin:0 0 8px">
            Prompt Lab tracks agent sessions, spend and activity across every project,
            from a local prompt history that never leaves the machine it was typed on.
          </p>
          <p style="line-height:1.55; margin:0 0 20px; color:var(--text-secondary)">
            This dashboard reads only processed data — daily counts, summaries and
            metrics. Raw prompts, commit messages, hostnames and file paths have no
            table here to be read from.
          </p>

          <div style="margin-bottom:20px">
            ${row('Build', built, info?.build_time ? freshClass(info.build_time) : '')}
            ${row('Data synced', info?.data_freshness ? timeAgo(info.data_freshness) : '—',
                  info?.data_freshness ? freshClass(info.data_freshness) : '')}
            ${row('Calendar days', 'America/Los_Angeles')}
          </div>

          <p style="line-height:1.55; color:var(--text-secondary); margin:0">
            Counts for the current day are provisional — they land when a session is
            summarized, so work still in progress isn't included yet.
          </p>

          ${onAsk && html`
            <div style="margin-top:22px; padding-top:18px; border-top:1px solid var(--border)">
              <button class="header-btn tap" onClick=${onAsk}
                      style="padding:8px 14px; border:1px solid var(--border); color:var(--accent-light)">
                Ask a question
              </button>
              <p style="line-height:1.55; color:var(--text-secondary); margin:8px 0 0; font-size:0.9rem">
                Put a question to the store in plain language. Press
                <span style="font-family:'SF Mono',ui-monospace,monospace">/</span> from any page
                to open it.
              </p>
            </div>`}

          <div style="margin-top:22px">
            <a href="https://github.com/nicolovejoy/prompt-lab" target="_blank" rel="noopener"
               style="color:var(--accent-light); text-decoration:none">
              github.com/nicolovejoy/prompt-lab ↗</a>
          </div>
        </div>`;
    }

    // ---- Day detail (#/day/<YYYY-MM-DD>) ----
    // Where a tap on a home-chart bar lands. A page rather than an overlay on
    // purpose: overlays position against the layout viewport, so on a
    // pinch-zoomed phone a "fixed" panel can render off-screen — which is
    // exactly how the below-chart readout this replaced failed. A navigation
    // needs no positioning, behaves identically on phone and web off one code
    // path, and gives a day a URL worth sending to yourself.
    function DayView({ date }) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);

      // Cache-first (#50): paint the last-seen copy of this day with no
      // skeleton, then revalidate only if the day can still change. A cached
      // error path is deliberate too — a background refresh that fails keeps
      // the cached day on screen rather than replacing it with an error.
      useEffect(() => {
        let alive = true;
        const entry = dayCacheGet(date);
        setData(entry ? entry.data : null);
        setErr(null);
        if (entry && !dayNeedsRevalidate(date, entry)) return;
        fetchDay(date)
          .then(d => { if (alive) setData(d); })
          .catch(e => { if (alive && !entry) setErr(e.message || 'could not load'); });
        return () => { alive = false; };
      }, [date]);

      const long = (() => {
        const [y, m, d] = date.split('-').map(Number);
        // Constructed in UTC and formatted in UTC: `date` is already a lab
        // calendar day (#48), so re-interpreting it in any zone would shift it.
        return new Intl.DateTimeFormat('en-US', {
          timeZone: 'UTC', weekday: 'long', month: 'long',
          day: 'numeric', year: 'numeric',
        }).format(new Date(Date.UTC(y, m - 1, d)));
      })();

      // Omitted entirely when empty: an empty "API spend" heading would imply
      // the section failed to load rather than that there was no spend.
      const section = (title, body) => body ? html`
        <div style="margin-top:22px">
          <div style="font-family:'SF Mono',ui-monospace,monospace; font-size:0.78rem;
                      letter-spacing:0.12em; text-transform:uppercase;
                      color:var(--text-secondary); margin-bottom:8px">${title}</div>
          <div class="card" style="font-size:0.98rem">${body}</div>
        </div>` : null;

      const stat = (label, n) => html`
        <div style="flex:1; min-width:96px; padding:12px 14px; background:var(--card);
                    border:1px solid var(--border); border-radius:var(--radius)">
          <div style="font-family:'SF Mono',ui-monospace,monospace; font-size:0.72rem;
                      letter-spacing:0.12em; text-transform:uppercase;
                      color:var(--text-secondary)">${label}</div>
          <div style="font-size:1.9rem; font-weight:700; color:var(--accent-light);
                      font-variant-numeric:tabular-nums">${n}</div>
        </div>`;

      return html`
        <div>
          <div style="margin-bottom:6px">
            <a class="tap" onClick=${() => history.back()}
               style="cursor:pointer; color:var(--text-secondary); font-size:0.95rem;
                      text-decoration:none">← back</a>
          </div>
          <h1 style="margin:0 0 4px; font-size:1.7rem; color:var(--accent-light)">${long}</h1>
          <div style="font-family:'SF Mono',ui-monospace,monospace; font-size:0.8rem;
                      color:var(--text-secondary); margin-bottom:18px">${date}</div>

          ${err && html`
            <div class="card" style="color:var(--red, #c62828)">could not load this day — ${err}</div>`}
          ${!data && !err && html`<${SkeletonList} />`}

          ${data && html`
            ${data.provisional && html`
              <div class="card" style="border-color:var(--accent); margin-bottom:14px;
                                       font-size:0.95rem; line-height:1.45">
                <b>Today, so far.</b> These counts come from daily summaries, which
                are written when a session ends (<code>/handoff</code>) or by the
                nightly synthesizer — so work still in progress isn't here yet.
                An unsummarized day and a quiet one would otherwise look identical.
              </div>`}

            <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px">
              ${stat('prompts', data.totals.prompts)}
              ${stat('sessions', data.totals.sessions)}
              ${stat('commits', data.totals.commits)}
              ${data.spend && data.spend.total_usd > 0
                && stat('api spend', fmtUsd(data.spend.total_usd))}
              ${data.visitors && data.visitors.views > 0
                && stat('page views', data.visitors.views)}
            </div>

            ${!data.projects.length && html`
              <div class="card" style="color:var(--text-secondary)">
                Nothing recorded for this day.
              </div>`}

            ${data.projects.map(p => html`
              <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:baseline;
                            gap:12px; margin-bottom:${p.summary ? '8px' : '0'}">
                  <a class="tap" href=${'#/project/' + encodeURIComponent(p.project)}
                     style="font-weight:600; color:var(--accent-light); text-decoration:none;
                            min-width:0; overflow-wrap:anywhere">
                    ${p.project}</a>
                  <div style="font-family:'SF Mono',ui-monospace,monospace; font-size:0.82rem;
                              color:var(--text-secondary); white-space:nowrap;
                              font-variant-numeric:tabular-nums">
                    ${p.prompts}p · ${p.sessions}s · ${p.commits}c
                  </div>
                </div>
                ${p.summary && html`
                  <div style="font-size:0.98rem; line-height:1.5">
                    <${MachineText}>${p.summary}<//>
                  </div>`}
                ${p.key_decisions.length > 0 && html`
                  <ul style="margin:8px 0 0; padding-left:18px; color:var(--text-secondary);
                             font-size:0.95rem; line-height:1.5">
                    ${p.key_decisions.map(k => html`<li>${k}</li>`)}
                  </ul>`}
              </div>`)}

            ${section('API spend', data.spend && data.spend.by_project.length && html`
              ${data.spend.by_project.map(s => html`
                <div style="display:flex; gap:8px; padding:3px 0">
                  <span>${s.project || 'unattributed'}</span>
                  <span style="margin-left:auto; font-variant-numeric:tabular-nums">
                    ${fmtUsd(s.usd)}</span>
                </div>`)}`)}

            ${section('Page views', data.visitors && data.visitors.by_site.length && html`
              ${data.visitors.by_site.map(s => html`
                <div style="display:flex; gap:8px; padding:3px 0">
                  <span>${s.site}</span>
                  <span style="margin-left:auto; font-variant-numeric:tabular-nums">
                    ${s.views}</span>
                </div>`)}`)}

            ${section('Uptime', data.uptime && data.uptime.length && html`
              ${data.uptime.map(u => html`
                <div style="display:flex; gap:8px; padding:3px 0">
                  <span>${u.monitor}</span>
                  <span style="margin-left:auto; font-variant-numeric:tabular-nums;
                               color:${u.uptime_1d == null ? 'var(--text-secondary)'
                                       : u.uptime_1d >= 99.9 ? 'var(--green)' : '#c62828'}">
                    ${u.uptime_1d == null ? '—' : u.uptime_1d.toFixed(2) + '%'}</span>
                </div>`)}`)}
          `}
        </div>`;
    }

    // A page's standing explanation. On a wide screen it sits above the data as
    // it always has. On a phone it took the top half of the first screen on
    // every visit, so it folds behind one line — read once, then out of the way.
    // Rendered twice and CSS picks, the same idiom as the two navs.
    function PageNote({ summary = 'About this data', children }) {
      return html`
        <div class="page-note-wide" data-test="page-note-wide">${children}</div>
        <details class="page-note-narrow" data-test="page-note">
          <summary>${summary}</summary>
          ${children}
        </details>`;
    }

    // The chart window buttons, once: five pages had their own copy, and the
    // copies had drifted (the home pair was a size smaller than the rest).
    function WindowPicker({ days, onChange, options = [7, 30, 90, 365] }) {
      return html`
        <div class="win-picker">
          ${options.map(d => html`
            <button class="win-btn" aria-pressed=${days === d ? 'true' : 'false'}
                    onClick=${() => onChange(d)}>${d === 365 ? '1y' : d + 'd'}</button>`)}
        </div>`;
    }

    function VisitorsOverview() {
      const [days, setDays] = useState(30);
      const [tab, setTab] = useState('pages');
      const [data, setData] = useState(() => visitorOverviewMemo.get(30) || null);
      const [loading, setLoading] = useState(!visitorOverviewMemo.has(30));

      useEffect(() => {
        const cached = visitorOverviewMemo.get(days);
        if (cached) { setData(cached); setLoading(false); }
        else { setData(null); setLoading(true); }
        const since = labDay(days);
        let alive = true;
        api('/api/visitor_overview?since=' + since)
          .then(d => { visitorOverviewMemo.set(days, d); if (alive) { setData(d); setLoading(false); } })
          .catch(e => { if (alive && !cached) { setData({ error: e.message }); setLoading(false); } });
        return () => { alive = false; };
      }, [days]);

      const header = html`
        <div style="display: flex; justify-content: space-between; align-items: baseline;
                    flex-wrap: wrap; gap: 12px; margin-bottom: 4px">
          <h1 style="margin: 0; font-size: 1.91rem; color: var(--accent-light)">Visitors</h1>
          <${WindowPicker} days=${days} onChange=${setDays} />
        </div>
        <${PageNote}>
          <div style="font-size: 1.06rem; color: var(--text-secondary); margin-bottom: 20px">
            Anonymous page views from the first-party beacon — cookie-less, IPs
            never stored, visitor hashes rotate daily (so uniques are per-day by
            design). Only instrumented sites appear here.
          </div>
          <div class="heatmap-note" style="margin: -12px 0 20px">
            Browser automation is excluded from ${AGENT_LABEL_DAY} onward. Earlier
            rows predate the label and may include test traffic — the beacon
            stores no user-agent, so it can't be sorted out after the fact.
          </div>
        <//>`;

      if (loading && !data) return html`<div>${header}<div class="cost-placeholder">Loading visitors…</div></div>`;
      if (!data || data.error) return html`<div>${header}<div class="cost-placeholder">Couldn't load visitors.</div></div>`;

      const panel = (children) => html`
        <div style="margin-top: 16px; padding: 14px; background: var(--bg-elevated, var(--card));
                    border: 1px solid var(--border); border-radius: 6px">${children}</div>`;
      const sectionTitle = (t) => html`
        <div style="font-size: 0.98rem; font-weight: 600; color: var(--text-secondary);
                    font-family: 'SF Mono', ui-monospace, monospace; text-transform: uppercase; margin-bottom: 8px">
          ${t}
        </div>`;
      const panelTitle = (t) => html`<div class="vis-panel-title">${sectionTitle(t)}</div>`;
      const TABS = [['pages', 'Pages'], ['referrers', 'Referrers'], ['countries', 'Countries']];
      const tabBar = html`
        <div class="sub-tabs vis-tabs" data-test="visitors-tabs" role="group" aria-label="Show list">
          ${TABS.map(([k, label]) => html`
            <button class="sub-tab ${tab === k ? 'active' : ''}"
                    aria-pressed=${tab === k ? 'true' : 'false'} data-test=${'tab-' + k}
                    onClick=${() => setTab(k)}>${label}</button>`)}
        </div>`;
      const panelClass = (k) => 'vis-panel' + (tab === k ? ' active' : '');
      const listRow = (label, sub, v) => html`
        <div class="list-row">
          <div class="list-row-text">
            <span class="list-row-label">${label}</span>
            ${sub && html`<span class="list-row-sub">${sub}</span>`}
          </div>
          <span class="list-row-value">${v.toLocaleString()}</span>
        </div>`;

      // ---- Sign-ins (issue #10) ----
      // Anonymous `login` beacon events, path=/login/<role>. The API block is
      // absent on deploys older than the beacon change, so this renders NOTHING
      // at all in that case rather than an empty panel. Login rows are filtered
      // out of every pageview query server-side, so they never touch the numbers
      // above. Deliberately role-only: no email, no id, no stable identifier.
      const LOGIN_DAY_CAP = 14;
      const signIns = (() => {
        const raw = data.logins;
        if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;

        const byRole = (Array.isArray(raw.by_role) ? raw.by_role : [])
          .map(r => [String(r?.role || 'unknown'), Number(r?.count) || 0])
          .filter(([, c]) => c > 0)
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
        const byDay = (Array.isArray(raw.by_day) ? raw.by_day : [])
          .map(r => [String(r?.date || ''), Number(r?.count) || 0])
          .filter(([d, c]) => d && c > 0)
          .sort((a, b) => (a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : 0));  // newest first

        const declared = Number(raw.total);
        const total = Number.isFinite(declared) && declared > 0
          ? declared
          : Math.max(byDay.reduce((s, [, c]) => s + c, 0),
                     byRole.reduce((s, [, c]) => s + c, 0));

        const shownDays = byDay.slice(0, LOGIN_DAY_CAP);
        const restDays = byDay.slice(LOGIN_DAY_CAP);
        const restCount = restDays.reduce((s, [, c]) => s + c, 0);
        const thisYear = String(new Date().getFullYear());

        return panel(html`
          ${sectionTitle('Sign-ins')}
          <div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap">
            <div style="font-size: 1.68rem; font-weight: 700; color: var(--accent-light);
                        font-variant-numeric: tabular-nums">${total.toLocaleString()}</div>
            <div style="font-size: 1.06rem; color: var(--text-secondary)">
              sign-in${total === 1 ? '' : 's'} · last ${days === 365 ? 'year' : days + ' days'}
            </div>
          </div>
          <div style="font-size: 0.98rem; color: var(--text-secondary); margin-top: 6px">
            Role only — no email or account id is recorded, so this counts
            sign-ins, not people.
          </div>
          ${total === 0
            ? html`<div style="font-size: 1.06rem; color: var(--text-secondary); margin-top: 12px">
                No sign-ins in this window.
              </div>`
            : html`<div class="two-col">
                <div>
                  ${sectionTitle('By role')}
                  ${byRole.length
                    ? byRole.map(([role, c]) => listRow(role, role === 'unknown' ? 'role not recorded' : null, c))
                    : html`<div style="font-size: 1.06rem; color: var(--text-secondary)">Not broken out.</div>`}
                </div>
                <div>
                  ${sectionTitle('By day')}
                  ${shownDays.length
                    ? shownDays.map(([d, c]) =>
                        listRow(fmtShortDate(d), d.slice(0, 4) === thisYear ? null : d.slice(0, 4), c))
                    : html`<div style="font-size: 1.06rem; color: var(--text-secondary)">Not broken out.</div>`}
                  ${restDays.length > 0 && html`
                    <div style="font-size: 0.98rem; color: var(--text-secondary); padding-top: 6px">
                      +${restCount.toLocaleString()} on ${restDays.length} earlier day${restDays.length === 1 ? '' : 's'}
                    </div>`}
                </div>
              </div>`}
        `);
      })();

      const daily = data.daily || [];
      if (!daily.length) return html`<div>${header}
        <div class="cost-placeholder">No page views in this window yet — only
        instrumented sites report. Roll out beacon.js to more sites to see them here.</div>
        ${signIns}</div>`;

      const bySite = {}, byDateSite = {};
      let totalViews = 0;
      for (const r of daily) {
        const v = Number(r.views) || 0;
        totalViews += v;
        bySite[r.site] = (bySite[r.site] || 0) + v;
        (byDateSite[r.date] ||= {})[r.site] = ((byDateSite[r.date]?.[r.site]) || 0) + v;
      }

      const ranked = Object.entries(bySite).sort((a, b) => b[1] - a[1]);
      const maxSite = Math.max(...ranked.map(([, v]) => v), 1);
      const previewHosts = Number(data.preview_hosts);
      const colorOf = {};
      ranked.forEach(([s], i) => { colorOf[s] = i < COST_PALETTE.length ? COST_PALETTE[i] : COST_OTHER; });
      const segColor = (s) => colorOf[s] || COST_OTHER;

      const dates = [];
      for (let i = days - 1; i >= 0; i--) {
        dates.push(labDay(i));
      }

      const paths = (data.paths || []).slice(0, 15);
      const referrers = (data.referrers || []).slice(0, 10);
      const countries = (data.countries || []).slice(0, 10);

      return html`
        <div>
          ${header}

          <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px">
            <div style="font-size: 2.18rem; font-weight: 700; color: var(--accent-light)">${totalViews.toLocaleString()}</div>
            <div style="font-size: 1.06rem; color: var(--text-secondary)">
