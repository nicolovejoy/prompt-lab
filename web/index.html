<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111">
  <title>Prompt Lab</title>
  <script>
    // Applied synchronously, before first paint, so a saved theme choice
    // never flashes the OS-default palette first.
    try {
      const saved = localStorage.getItem('promptlab_theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch { /* localStorage unavailable (private mode, etc.) — fall back to OS preference */ }
  </script>
  <script defer src="/beacon.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root {
      --bg: #111;
      --card: #1a1a1a;
      --card-hover: #222;
      --text: #e5e5e5;
      --text-secondary: #d0d0d0;
      --border: #2a2a2a;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-dim: rgba(99, 102, 241, 0.15);
      --green: #22c55e;
      --green-dim: rgba(34, 197, 94, 0.15);
      --yellow: #eab308;
      --yellow-dim: rgba(234, 179, 8, 0.15);
      --red: #ef4444;
      --red-dim: rgba(239, 68, 68, 0.15);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius: 8px;
    }
    /* Light palette applies when the OS prefers it (no explicit in-app choice yet)
       or when the theme toggle has explicitly set data-theme="light". An explicit
       data-theme always wins over the OS preference, in either direction. */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        --bg: #fafafa;
        --card: #fff;
        --card-hover: #f5f5f5;
        --text: #111;
        --text-secondary: #404040;
        --border: #e5e5e5;
        --accent: #4f46e5;
        --accent-light: #6366f1;
        --accent-dim: rgba(79, 70, 229, 0.1);
        --green: #16a34a;
        --green-dim: rgba(22, 163, 74, 0.1);
        --yellow: #ca8a04;
        --yellow-dim: rgba(202, 138, 4, 0.1);
        --red: #dc2626;
        --red-dim: rgba(220, 38, 38, 0.1);
      }
    }
    :root[data-theme="light"] {
      --bg: #fafafa;
      --card: #fff;
      --card-hover: #f5f5f5;
      --text: #111;
      --text-secondary: #404040;
      --border: #e5e5e5;
      --accent: #4f46e5;
      --accent-light: #6366f1;
      --accent-dim: rgba(79, 70, 229, 0.1);
      --green: #16a34a;
      --green-dim: rgba(22, 163, 74, 0.1);
      --yellow: #ca8a04;
      --yellow-dim: rgba(202, 138, 4, 0.1);
      --red: #dc2626;
      --red-dim: rgba(220, 38, 38, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: var(--safe-top) 24px var(--safe-bottom); }

    /* Login */
    .login { max-width: 320px; margin: 120px auto; text-align: center; }
    .login h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.3px; }
    .login p { color: var(--text-secondary); font-size: 1.16rem; margin-bottom: 24px; }
    .login input {
      width: 100%; padding: 10px 14px; margin-bottom: 10px;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-size: 1.23rem; font-family: inherit; text-align: center;
    }
    .login input:focus { outline: none; border-color: var(--accent); }
    .login button {
      width: 100%; padding: 10px; background: var(--accent); color: white;
      border: none; border-radius: var(--radius); font-size: 1.23rem; font-weight: 600; cursor: pointer;
    }
    .login button:disabled { opacity: 0.4; }
    .login .google-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .login .login-divider {
      display: flex; align-items: center; gap: 10px;
      color: var(--text-secondary); font-size: 0.92rem; margin: 20px 0 14px;
    }
    .login .login-divider::before, .login .login-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* Header — stacked rows (logo, then built/synced, then nav) so the nav
       buttons stay together instead of wrapping around the meta text. */
    header {
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    .header-left { display: flex; align-items: center; gap: 6px; }
    .header-sub {
      display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 2px 0 10px;
      font-size: 0.61rem; font-family: "SF Mono", ui-monospace, monospace;
    }
    .header-sub .fresh { color: var(--green); }
    .header-sub .stale { color: #6e6e6e; }
    .header-logo {
      font-size: 1.43rem; font-weight: 700; letter-spacing: -0.3px;
      cursor: pointer; color: var(--text); text-decoration: none;
    }
    .header-sep { color: var(--text-secondary); font-size: 1.36rem; }
    .logo-short { display: none; }
    .breadcrumb { font-size: 1.36rem; color: var(--text-secondary); font-weight: 500; }
    .breadcrumb a { color: var(--text-secondary); text-decoration: none; cursor: pointer; }
    .breadcrumb a:hover { color: var(--accent-light); }
    /* flex-wrap so this row drops to its own line under a narrow viewport instead of
       clipping/squeezing buttons off-screen — this is what was hiding the theme toggle. */
    .header-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }

    /* Nav on a phone. The flat row wrapped onto two or three lines and pushed
       the page content down before you'd read a word of it — six destinations,
       a theme toggle, an email and a log-out button don't fit 390px. Below
       640px they collapse behind one button and drop down as a list. Kept as a
       plain CSS swap (both markups always render, one is display:none) so
       there's no viewport-width state in JS to get out of sync on rotate. */
    /* display:contents so these stay direct flex children of .header-right and
       the wide row lays out exactly as it did before the wrapper existed. It
       MUST live here and not as an inline style — an inline style outranks
       every selector below, which is what left both navs on screen at once. */
    .nav-wide { display: contents; }
    .nav-toggle { display: none; }
    .nav-drop { display: none; }
    /* The theme icon renders twice — once inside .nav-wide, once beside the
       hamburger — and CSS picks, same as the two navs. Exactly one is ever
       visible, so it stays one tap at every width. */
    .theme-narrow { display: none; }
    @media (max-width: 640px) {
      .nav-wide { display: none; }
      .theme-narrow { display: inline-flex; }
      .nav-toggle {
        display: inline-flex; align-items: center; gap: 7px;
        font-size: 1.02rem; font-family: inherit; cursor: pointer;
        padding: 6px 12px; border-radius: 6px;
        border: 1px solid var(--border); background: transparent; color: var(--text);
      }
      .nav-drop.open {
        display: flex; flex-direction: column; gap: 2px;
        width: 100%; margin-top: 8px; padding: 6px;
        background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      }
      .nav-drop .header-btn {
        width: 100%; text-align: left; padding: 11px 12px; font-size: 1.05rem;
      }
      .nav-drop .header-user { padding: 4px 12px; }
      .nav-more { display: contents; }   /* phone: inline, no second surface */
      /* One line: the header is a block, so .header-left and .header-right
         stacked as two rows — right for the wide nav, which needs the whole
         width, but it put the Menu button a full line under the logo. Here the
         header is the flex row and .header-right dissolves into it, so the
         theme toggle and Menu sit beside the logo and the open list, at
         flex-basis 100%, still wraps below as a full-width row. */
      header { display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; }
      .header-right { display: contents; }
      .nav-drop.open { flex-basis: 100%; }
      /* min-width:0 down the chain so a long project name truncates instead
         of pushing the buttons off the line. */
      .header-left { flex: 1 1 0; min-width: 0; }
      .header-logo { flex: none; display: inline-flex; align-items: center; min-height: 44px; }
      /* Beside the project picker the wordmark shrinks to "PL", so an ordinary
         project name reads in full; the name is the page's subject there. */
      .has-picker .logo-full { display: none; }
      .has-picker .logo-short { display: inline; }
      .header-sep { flex: none; }
      .picker, .picker-btn { min-width: 0; max-width: 100%; }
      .picker-btn { min-height: 44px; }
      .theme-btn { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
      /* Icon only: the word cost 45px the project name needs. It stays in the
         accessibility tree, and the button keeps aria-label="Menu". */
      .nav-toggle { min-height: 44px; min-width: 44px; justify-content: center; }
      .nav-toggle-label {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
      }
      .nav-drop .header-btn { min-height: 44px; }
    }

    /* Wide screens: the second tier is a panel hanging off "More". */
    .nav-more {
      position: absolute; top: 100%; right: 0; z-index: 40; min-width: 190px;
      display: flex; flex-direction: column; gap: 2px; padding: 6px; margin-top: 6px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    }
    .nav-more .header-btn { width: 100%; text-align: left; padding: 8px 10px; }
    .nav-sep { height: 1px; background: var(--border); margin: 5px 2px; }
    /* Now the first row in the panel, so the padding leads rather than trails. */
    .nav-build {
      padding: 3px 10px 5px; font-size: 0.7rem; white-space: nowrap;
      font-family: "SF Mono", ui-monospace, monospace;
    }
    .nav-build-label {
      text-transform: uppercase; letter-spacing: 0.07em;
      opacity: 0.7; margin-right: 5px;
    }
    .nav-build.fresh { color: var(--green); }
    .nav-build.stale { color: #6e6e6e; }
    /* Icon-only: square, centred, and sized so the glyph matches the adjacent
       word-buttons' optical weight rather than their font-size. */
    .theme-btn {
      font-size: 1.15rem; line-height: 1; padding: 5px 9px;
    }
    header { position: relative; }
    .header-meta {
      font-size: 1.02rem; color: var(--text-secondary); font-family: "SF Mono", ui-monospace, monospace;
    }
    /* Identity, not navigation — sized to the built/synced sub-line so it recedes. */
    .header-user {
      font-size: 0.61rem; color: var(--text-secondary); opacity: 0.65;
      font-family: "SF Mono", ui-monospace, monospace;
    }
    .header-btn {
      font-size: 1.09rem; color: var(--text-secondary); cursor: pointer;
      background: none; border: none; font-family: inherit; padding: 4px 10px;
      border-radius: 4px;
    }
    .header-btn:hover { color: var(--text); background: var(--card); }
    .header-btn.active { color: var(--text); background: var(--card); }
    .header-meta.refreshing {
      display: inline-block; animation: spin 0.9s linear infinite; opacity: 0.7;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Project picker (top-nav) */
    .picker { position: relative; display: inline-flex; }
    .picker-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: none; font-family: inherit; font-size: 1.36rem;
      font-weight: 500; color: var(--text-secondary); cursor: pointer; padding: 0;
    }
    .picker-btn:hover { color: var(--accent-light); }
    .picker-caret { font-size: 0.89rem; opacity: 0.7; flex: none; }
    .picker-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker-menu {
      position: absolute; top: 100%; left: 0; margin-top: 8px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      min-width: 200px; max-height: 60vh; overflow-y: auto; padding: 4px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4); z-index: 50;
    }
    .picker-section {
      font-size: 0.82rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-secondary); padding: 8px 10px 3px;
    }
    .picker-item {
      display: block; width: 100%; text-align: left; padding: 7px 10px;
      font-size: 1.16rem; color: var(--text); background: none; border: none;
      cursor: pointer; border-radius: 5px; font-family: inherit;
    }
    .picker-item:hover { background: var(--card-hover); }
    .picker-item.active { color: var(--accent-light); font-weight: 600; }

    /* Chart window buttons (WindowPicker). */
    .win-picker { display: flex; gap: 4px; }
    .win-btn {
      font-size: 0.98rem; padding: 4px 10px; border-radius: 4px;
      cursor: pointer; font-family: inherit; border: 1px solid var(--border);
      background: transparent; color: var(--text-secondary);
    }
    .win-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }

    /* A list row that links through (Costs and Activity, By project). */
    .row-link {
      display: block; padding: 5px 0; text-decoration: none;
      color: var(--text); border-bottom: 1px solid var(--border);
    }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; }


    /* Cost placeholder (loading / no-spend states) */
    .cost-placeholder {
      margin-top: 16px; padding: 16px; background: var(--card);
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 1.09rem; color: var(--text-secondary); line-height: 1.5;
    }

    .overview-stats {
      font-size: 1.36rem; color: var(--text-secondary); margin-bottom: 24px;
    }
    .overview-stats strong { color: var(--text); }

    /* Project page */
    .project-header { margin-bottom: 24px; }
    /* The row wraps, so on a phone the links drop under the name instead of
       pushing past the edge (a site link alone did, at 390px). The name is the
       page's title, so a long one wraps; the site link is a label, so it keeps
       one line and truncates. On a wide screen everything fits on one line. */
    .project-title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 6px; }
    .project-name { font-size: 1.91rem; font-weight: 600; letter-spacing: -0.3px; color: var(--accent-light);
                    min-width: 0; overflow-wrap: anywhere; }
    .project-links { display: flex; gap: 8px; align-items: center; min-width: 0; max-width: 100%; }
    .project-link {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 0.98rem; color: var(--text-secondary); text-decoration: none;
      padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px;
      font-family: "SF Mono", ui-monospace, monospace; transition: border-color 0.15s;
    }
    .project-link:hover { border-color: var(--text-secondary); color: var(--text); }
    .project-meta {
      font-size: 1.09rem; color: var(--text-secondary); margin-bottom: 10px;
      font-family: "SF Mono", ui-monospace, monospace;
    }
    .project-summary { font-size: 1.23rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
    .project-layout { display: grid; grid-template-columns: 1fr 300px; gap: 24px; }
    @media (max-width: 800px) { .project-layout { grid-template-columns: 1fr; } }
    .project-sidebar > * + * { margin-top: 16px; }
    .sidebar-section {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
    }
    .sidebar-label {
      font-size: 0.89rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 8px;
    }

    /* Activity heatmap.

       The month labels used to be `justify-content: space-between` on a
       full-width row while the grid was 53 fixed 8px columns (~530px),
       left-aligned and never stretched. The two rows were therefore drawn to
       different scales: the grid's right edge — today — landed under the 7th
       of 13 labels, so six months of continuous work read as "dead since
       March". The label row also sat outside the scroller, so on a phone it
       didn't move with the grid.

       Both rows now live in one scroll container inside a `width: max-content`
       track, and the label row carries the SAME flex geometry as the grid: one
       8px slot per week, 2px gap. Alignment is structural — there is no pitch
       constant to keep in sync, because a label is positioned by occupying its
       own week's slot. */
    .heatmap-scroll { overflow-x: auto; margin-bottom: 16px; }
    /* Horizontal padding keeps the first and last month labels, which overhang
       their 8px slots, from being clipped. It applies to both rows at once, so
       it cannot pull them out of register. */
    .heatmap-track { width: max-content; padding: 0 16px; }
    .heatmap { display: flex; gap: 2px; flex-wrap: nowrap; }
    .heatmap-month { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
    .heatmap-cell { width: 8px; height: 8px; border-radius: 2px; }
    .heatmap-cell-0 { background: var(--border); }
    .heatmap-cell-1 { background: var(--accent); opacity: 0.25; }
    .heatmap-cell-2 { background: var(--accent); opacity: 0.5; }
    .heatmap-cell-3 { background: var(--accent); opacity: 0.75; }
    .heatmap-cell-4 { background: var(--accent); opacity: 1; }
    .heatmap-labels {
      display: flex; gap: 2px; flex-wrap: nowrap;
      font-size: 0.82rem; color: var(--text-secondary);
      font-family: "SF Mono", ui-monospace, monospace; margin-bottom: 4px;
    }
    /* One slot per week column, same width and gap as .heatmap-cell. */
    .heatmap-labelslot { width: 8px; flex-shrink: 0; position: relative; height: 20px; }
    .heatmap-labeltext {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      white-space: nowrap;
    }
    /* Same convention as DateAxis: a dot at the column's true centre, so the
       eye can draw the line from label to column without counting squares. */
    .heatmap-labeldot {
      position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      width: 3px; height: 3px; border-radius: 50%;
      background: currentColor; opacity: 0.45;
    }

    /* Why the series steps up on 2026-08-14 — see .heatmap-note in the render. */
    .heatmap-note {
      margin-top: 6px; font-size: 0.75rem; line-height: 1.4;
      color: var(--text-secondary); opacity: 0.8; max-width: 60ch;
    }

    .sub-tabs {
      display: flex; gap: 2px; margin-bottom: 18px;
      background: var(--card); padding: 3px; border-radius: var(--radius);
    }
    .sub-tab {
      padding: 7px 16px; font-size: 1.09rem; font-weight: 600; color: var(--text-secondary);
      background: none; border: none; cursor: pointer; border-radius: 6px; font-family: inherit;
    }
    .sub-tab.active { background: var(--accent); color: white; }
    @media (max-width: 600px) {
      .sub-tabs { overflow-x: auto; flex-wrap: nowrap; }
      .sub-tab { white-space: nowrap; flex-shrink: 0; }
    }

    /* minmax(0, …), not a bare 1fr: a 1fr track's minimum is its content, so one
       long unwrapped hostname set the width of the whole page (767px in a 390px
       viewport on #/visitors). */
    .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
    .chart-scroll { overflow-x: auto; }
    /* A phone chart's row keeps vertical swipes for the page and horizontal
       drags for scrubbing the selection. Only narrow: a wide chart scrolls
       sideways inside .chart-scroll, and a finger must still be able to pan it. */
    .chart-bars.narrow { touch-action: pan-y; }
    .chart-readout {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
      font-size: 0.95rem; min-width: 0;
    }
    .chart-readout-head { font-weight: 600; margin-bottom: 6px; overflow-wrap: anywhere; }
    .chart-readout-row {
      display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--text-secondary);
    }
    .chart-readout-swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
    /* Hostnames arrive as 70-character tokens with no break point. */
    .chart-readout-name { color: var(--text); flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .chart-readout-value { flex: none; font-variant-numeric: tabular-nums; }
    .chart-readout-more { color: var(--text-secondary); padding: 2px 0; }
    .chart-open-day, .chart-day-chip {
      min-height: 44px; border: 1px solid var(--border); border-radius: 6px;
      background: transparent; color: var(--accent); font: inherit; cursor: pointer;
    }
    .chart-open-day { display: block; width: 100%; margin-top: 10px; }
    .chart-day-chips {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 6px; margin-top: 10px;
    }
    .chart-day-chip { min-width: 44px; padding: 0; font-variant-numeric: tabular-nums; }
    /* A collapsed uptime card on a phone: one row, one tap target. */
    .uptime-toggle {
      display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px;
      padding: 8px 0; background: none; border: 0; color: inherit;
      font: inherit; font-size: 1.02rem; text-align: left; cursor: pointer;
    }
    .uptime-toggle-name {
      flex: 1; min-width: 0; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    @media (max-width: 600px) {
      .two-col { grid-template-columns: minmax(0, 1fr); }
    }

    /* One-line rows with an ellipsis on a wide screen; on a phone the label wraps
       and its sub-label drops underneath, because an ellipsis there hides the
       only part of a path that tells two pages apart. */
    .list-row {
      display: flex; align-items: center; gap: 8px; padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .list-row-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1 1 auto; }
    .list-row-label { font-size: 1.12rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-row-sub {
      font-size: 0.85rem; color: var(--text-secondary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .list-row-value { margin-left: auto; flex: none; font-size: 1.12rem; font-variant-numeric: tabular-nums; }
    /* A share row centres on one line like any other row; on a phone its name can
       wrap, so the swatch, share and count pin to the first line instead. It is a
       block (its head line over its share bar), with a list row's rule and spacing. */
    .share-row { padding: 5px 0; border-bottom: 1px solid var(--border); }
    .share-row-head { display: flex; align-items: center; gap: 8px; }
    @media (max-width: 600px) {
      .list-row { align-items: flex-start; padding: 8px 0; }
      .share-row { padding: 8px 0; }
      .list-row-text { flex-direction: column; gap: 1px; }
      .list-row-label, .list-row-sub { white-space: normal; overflow-wrap: anywhere; }
      .share-row-head { align-items: flex-start; }
      .share-row-swatch { margin-top: 7px; }
    }

    /* Three lists stacked on a phone ran to 2,800px. Below 600px they share one
       slot behind a tab bar; above it the bar is hidden and all three show, so
       the wide layout is exactly what it was. Both markups always render and
       CSS picks — no viewport state in JS to desync on rotate. */
    .vis-tabs { display: none; }
    .page-note-narrow { display: none; }
    @media (max-width: 600px) {
      .vis-tabs { display: flex; gap: 4px; margin-top: 4px; }
      .vis-tabs .sub-tab { flex: 1 1 0; min-height: 44px; padding: 7px 6px; }
      .vis-panel { display: none; }
      .vis-panel.active { display: block; }
      /* The active tab already names the list. */
      .vis-panel .vis-panel-title { display: none; }
      .two-col.vis-second { margin-top: 0; }

      .page-note-wide { display: none; }
      .page-note-narrow { display: block; margin: 0 0 16px; }
      .page-note-narrow summary {
        display: flex; align-items: center; min-height: 44px; cursor: pointer;
        font-size: 1.02rem; color: var(--accent); list-style: none;
      }
      /* flex on the summary drops the native triangle; this chevron replaces it,
         pointing right when closed and down when open. */
      .page-note-narrow summary::-webkit-details-marker { display: none; }
      .page-note-narrow summary::after {
        content: ''; width: 7px; height: 7px; margin-left: 10px;
        border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent);
        transform: rotate(-45deg);
      }
      .page-note-narrow[open] summary::after { transform: rotate(45deg); }
      /* !important because the wrapped blocks bring inline margins written for the
         wide layout (a negative top pulls a note up under its paragraph), and an
         inline style outranks every selector. Any child, not just a div, so a note
         wrapped in a p is covered too; the summary keeps its own spacing. */
      .page-note-narrow > :not(summary) { margin: 0 0 12px !important; }
    }

    /* Cards */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 10px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .card-title { font-size: 1.16rem; font-weight: 600; }
    .card-date { font-size: 0.95rem; color: var(--text-secondary); font-family: "SF Mono", ui-monospace, monospace; }
    .card-body { font-size: 1.12rem; color: var(--text-secondary); line-height: 1.55; }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .tag { font-size: 0.93rem; padding: 2px 7px; background: var(--border); color: var(--text-secondary); border-radius: 3px; }
    .count-badges { display: flex; gap: 10px; margin-top: 8px; }
    .count-badge { font-size: 0.93rem; color: var(--text-secondary); }
    .count-badge strong { color: var(--text); }

    /* Status badges */
    .status-badge {
      display: inline-block; padding: 2px 7px; font-size: 0.89rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; border-radius: 3px;
    }
    .status-active { background: var(--green-dim); color: var(--green); }
    .status-completed { background: var(--accent-dim); color: var(--accent-light); }
    .status-stalled { background: var(--yellow-dim); color: var(--yellow); }

    /* Vertical timeline */
    .timeline { position: relative; padding-left: 20px; }
    .timeline::before {
      content: ''; position: absolute; left: 4px; top: 0; bottom: 0;
      width: 1px; background: var(--border);
    }
    .timeline-date {
      font-size: 1.09rem; font-weight: 600; color: var(--text-secondary);
      margin: 20px 0 8px; position: relative;
      font-family: "SF Mono", ui-monospace, monospace;

    .timeline-date:first-child { margin-top: 0; }
    .timeline-entry {
      position: relative; font-size: 1.2rem; color: var(--text-secondary);
      line-height: 1.6; padding: 6px 0; cursor: pointer;
      border-radius: 6px; transition: background 0.15s;
    }
    .timeline-entry:hover { background: var(--card); margin: 0 -8px; padding: 6px 8px; }
    .timeline-entry::before {
      content: ''; position: absolute; left: -20px; top: 12px;
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    }
    .timeline-entry:hover::before { left: -12px; }
    .timeline-entry.rollup { cursor: default; }
    .timeline-entry.rollup:hover { background: none; margin: 0; padding: 6px 0; }
    .timeline-entry.rollup::before { background: var(--green); }
    .timeline-entry.rollup:hover::before { left: -20px; }
    .timeline-phrase { font-size: 1.2rem; }
    .timeline-expand {
      margin-top: 8px; padding: 10px 12px; background: var(--card);
      border: 1px solid var(--border); border-radius: 6px;
    }
    .timeline-expand-summary {
      font-size: 1.12rem; color: var(--text); line-height: 1.6; margin-bottom: 8px;
    }
    .timeline-expand-decisions {
      list-style: none; padding: 0; margin: 0 0 8px;
    }
    .timeline-expand-decisions li {
      font-size: 1.06rem; color: var(--text-secondary); line-height: 1.5;
      padding: 2px 0 2px 12px; position: relative;
    }
    .timeline-expand-decisions li::before {
      content: '·'; position: absolute; left: 0; font-weight: 700;
    }
    .timeline-expand-counts {
      display: flex; gap: 12px; font-size: 0.95rem; color: var(--text-secondary);
      font-family: "SF Mono", ui-monospace, monospace;
    }
    .timeline-expand-counts strong { color: var(--text); }
    .timeline-rollup-text {
      font-size: 1.12rem; color: var(--text-secondary); line-height: 1.55;
      padding: 6px 0 2px;
    }
    .timeline-rollup-label {
      font-size: 0.89rem; font-weight: 600; color: var(--green);
      text-transform: uppercase; letter-spacing: 0.3px;
    }

    /* Review cards */
    .review-card { border-left: 3px solid var(--accent); }
    .review-content { max-height: 200px; overflow: hidden; transition: max-height 0.3s; }
    .review-content.expanded { max-height: none; }
    .review-expand {
      font-size: 1.02rem; color: var(--accent-light); background: none;
      border: none; cursor: pointer; margin-top: 6px; padding: 0; font-family: inherit;
    }

    /* Ask modal */
    .ask-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100;
      display: flex; align-items: flex-start; justify-content: center; padding-top: 15vh;
    }
    .ask-modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;

    }
    .ask-modal-title { font-size: 1.16rem; font-weight: 600; margin-bottom: 12px; }
    .ask-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .ask-input {
      flex: 1; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 1.16rem; font-family: inherit;
    }
    .ask-input::placeholder { color: var(--text-secondary); }
    .ask-btn {
      padding: 10px 16px; background: var(--accent); color: white;
      border: none; border-radius: var(--radius); font-size: 1.16rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .ask-btn:disabled { opacity: 0.4; }
    .ask-answer {
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);

      max-height: 50vh; overflow-y: auto;
    }
    .ask-examples {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
    }
    .ask-example {
      font-size: 0.98rem; padding: 4px 10px; background: var(--border);
      color: var(--text-secondary); border: none; border-radius: 4px;
      cursor: pointer; font-family: inherit;
    }
    .ask-example:hover { color: var(--text); }

    /* Machine-voice marker (AI-authored text — tenet #1) */
    .machine { font-style: italic; color: var(--text-secondary); }
    .machine-mark {
      display: inline-block; margin-left: 8px;
      font-style: normal; font-size: 0.82rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6;
      font-family: "SF Mono", ui-monospace, monospace; white-space: nowrap;
    }

    /* Section labels (project page Now/Trajectory/Cost/History) */
    .section-label {
      font-size: 0.89rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-secondary);
      margin: 28px 0 12px;
    }
    .section-label:first-child { margin-top: 0; }

    /* Stream (home cross-project feed) */
    /* A project name with no break point would set the row's width; let it
       break anywhere so it wraps like the phrase after it. */
    .stream-project {
      font-weight: 600; color: var(--text); cursor: pointer; text-decoration: none;
      overflow-wrap: anywhere;
    }
    .stream-project:hover { color: var(--accent-light); }
    .dormant-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .dormant-chip {
      font-size: 1.09rem; color: var(--text-secondary); cursor: pointer;
      padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px;
    }
    .dormant-chip:hover { border-color: var(--text-secondary); color: var(--text); }
    a.dormant-chip { text-decoration: none; }
    .dormant-chip.muted { opacity: 0.66; }

    /* Pulse KPI tiles (issue #31).
       A tile that goes somewhere carries a PERSISTENT cue (↗ for navigation,
       ▾ for the inline expansion) — the old hover-only border tint was
       invisible on touch (no hover) and used a hardcoded dark hex that
       vanished in the light theme. Hover/focus is additive on top of the
       glyph, never the only signal. Unlinked tiles get no glyph, so the
       glyph stays a real "this does something" signal. */
    .kpi-tile {
      position: relative; display: block; width: 100%; text-align: left;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 15px; min-height: 104px;
      color: var(--text); text-decoration: none; font-family: inherit;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
    }
    .kpi-tile-action { cursor: pointer; }
    .kpi-tile-action:hover, .kpi-tile-action:focus-visible {
      border-color: var(--accent); background: var(--card-hover); transform: translateY(-1px);
    }
    .kpi-tile-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .kpi-cue {
      position: absolute; top: 9px; right: 11px; line-height: 1;
      font-size: 1.02rem; color: var(--accent-light); opacity: 0.8;
      transition: opacity 0.15s, transform 0.15s;
    }
    .kpi-tile-action:hover .kpi-cue,
    .kpi-tile-action:focus-visible .kpi-cue { opacity: 1; }
    .kpi-cue.open { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .kpi-tile, .kpi-cue { transition: none; }
      .kpi-tile-action:hover, .kpi-tile-action:focus-visible { transform: none; }
    }

    /* Project metadata (issue #23) — category / private / status */
    .meta-editor {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      margin-top: 10px; font-size: 1.09rem; color: var(--text-secondary);
    }
    .meta-editor select {
      font-family: inherit; font-size: 1.09rem; padding: 4px 8px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
    }
    .meta-editor select:disabled { opacity: 0.5; cursor: default; }
    .meta-editor label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .meta-saved { color: var(--green); }
    .meta-error { color: var(--red); }
    .badge {
      font-size: 0.95rem; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 4px; border: 1px solid var(--border);
      color: var(--text-secondary); white-space: nowrap;
    }
    .badge-private { border-color: var(--text-secondary); }
    .is-private { opacity: 0.62; }

    /* Misc */
    .loading { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 1.16rem; }
    .error { color: var(--red); text-align: center; padding: 20px; font-size: 1.16rem; }
    .empty {
      color: var(--text-secondary); text-align: center; padding: 40px; font-size: 1.16rem;
      border: 1px dashed var(--border); border-radius: var(--radius); margin-bottom: 12px;
    }
    .skeleton {
      background: var(--card); border-radius: var(--radius); animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.3; }
    }
    .skeleton-card { height: 80px; margin-bottom: 10px; }

    /* Tap targets on a phone: 44px tall at least, grown with min-height so the
       text keeps its size. .tap marks a control whose wide-screen styling is
       inline; an anchor with no display of its own becomes a flex box so its
       text centres in the taller box. Inline links in running text are not
       marked and stay as they are. Last in the sheet, so it outranks the
       base rules whose boxes it grows. */
    @media (max-width: 640px) {
      .tap, .win-btn, .sub-tab, .picker-item, select { min-height: 44px; }
      /* WebKit draws a native select at a fixed height and ignores min-height
         and padding, so on a phone every select drops the native look and
         draws its own box and caret (the project page's metadata selects
         already had the box; naming them here outranks their own rule). */
      select, .meta-editor select {
        -webkit-appearance: none; appearance: none; padding: 0 26px 0 8px;
        border: 1px solid var(--border); border-radius: 4px;
        background-color: var(--bg); color: var(--text);
        background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                          linear-gradient(135deg, currentColor 50%, transparent 50%);
        background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
        background-size: 5px 5px; background-repeat: no-repeat;
      }
      a.tap { display: inline-flex; align-items: center; }
      .win-btn { min-width: 44px; }
      /* The legend's row gap was spacing between 18px lines; 44px entries
         carry their own. */
      .chart-legend { row-gap: 0; }
      .row-link { display: flex; flex-direction: column; justify-content: center; min-height: 44px; }
      /* An ellipsis needs a block box, so these grow by line-height, not flex. */
      .project-link { min-height: 44px; line-height: 42px; padding-top: 0; padding-bottom: 0; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { h, render, Fragment } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useCallback, useRef } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    const html = htm.bind(h);

    // ---- Router ----
    // The three metrics #/activity can decompose (issue #31). Declared here
    // because parseHash validates against it.
    const ACTIVITY_METRICS = ['sessions', 'prompts', 'commits'];

    // The day log-prompt.sh stopped discarding prompts under 20 characters.
    // Every prompt-count series has a one-off step up here that is a capture
    // change, not a change in how much work happened. Annotated rather than
    // smoothed: an unexplained jump costs more than a footnote.
    const CAPTURE_FIX_DAY = '2026-08-14';

    // Issue #52. From this day, beacon rows carry an `agent` label and every
    // visitor read filters it out. Rows before it are unlabelled and may
    // include test-agent traffic; the beacon stores no UA, so no backfill is
    // possible. Same convention as CAPTURE_FIX_DAY: annotate, never smooth.
    const AGENT_LABEL_DAY = '2026-08-17';

    function parseHash() {
      const hash = (location.hash || '#/').slice(1);
      const parts = hash.split('/').filter(Boolean);
      if (parts[0] === 'project' && parts[1]) {
        return { view: 'project', project: decodeURIComponent(parts[1]), section: parts[2] || 'timeline' };
      }
      if (parts[0] === 'costs') return { view: 'costs' };
      // #/activity/<metric> — an unknown or missing metric falls back to
      // sessions rather than 404ing, so a hand-typed hash always lands.
      if (parts[0] === 'activity') {
        const m = parts[1] && decodeURIComponent(parts[1]);
        return { view: 'activity', metric: ACTIVITY_METRICS.includes(m) ? m : 'sessions' };
      }
      // #/day/<YYYY-MM-DD>. A malformed date falls through to home rather than
      // rendering a page that queries for nonsense.
      if (parts[0] === 'day' && /^\d{4}-\d{2}-\d{2}$/.test(parts[1] || '')) {
        return { view: 'day', date: parts[1] };
      }
      if (parts[0] === 'about') return { view: 'about' };
      if (parts[0] === 'visitors') return { view: 'visitors' };
      if (parts[0] === 'todos') return { view: 'todos' };
      if (parts[0] === 'health') return { view: 'health' };
      return { view: 'home' };
    }

    function navigate(hash) { location.hash = hash; }

    function useRoute() {
      const [route, setRoute] = useState(parseHash);
      useEffect(() => {
        const onChange = () => setRoute(parseHash());
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      return route;
    }

    // ---- API helpers ----
    // Retry once on a transient failure (network blip or 5xx cold-start from
    // the serverless/Turso layer) so an occasional load error self-heals
    // instead of forcing the user to reload. 401 never retries.
    async function api(path, retries = 1) {
      for (let attempt = 0; ; attempt++) {
        try {
          const resp = await fetch(path);
          if (resp.status === 401) throw Object.assign(new Error('unauthorized'), { status: 401 });
          if (!resp.ok) throw Object.assign(new Error('HTTP ' + resp.status), { status: resp.status });
          return await resp.json();
        } catch (e) {
          if (e.message === 'unauthorized' || attempt >= retries) throw e;
          await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
        }
      }
    }

    async function apiPost(path, body) {
      const resp = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (resp.status === 401) throw new Error('unauthorized');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    }

    // ---- Client cache ----------------------------------------------------
    // Two layers, both stale-while-revalidate (show last-seen instantly, then
    // refetch in the background and swap in fresh data):
    //   • memo — in-session Maps, so back-nav between projects is instant.
    //   • localStorage — survives reload, so a cold load paints from the last
    //     visit's data while the network request is still in flight.
    const memo = { project: new Map(), cost: new Map() };
    function lsGet(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; } }
    function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch { /* quota — skip */ } }

    // ---- Per-day cache (#50) ---------------------------------------------
    // The day page is reached by tapping a chart column, so it is opened often
    // and re-opened often, and on a phone the cold `/api/day` round trip is
    // most of what the page costs.
    //
    // A past lab day is immutable once it has been summarized, so it is served
    // from cache with no request at all. Two cases are NOT immutable and are
    // always revalidated after painting from cache (stale-while-revalidate):
    //   • today and yesterday — the 2:30am synthesizer still rewrites them;
    //   • any entry stored while `provisional` was true, i.e. captured on the
    //     day itself, before its summaries existed.
    // Serving a provisional entry as final is exactly the "quiet day vs.
    // untallied day" confusion the Today banner exists to prevent, so the
    // provisional flag is stored with the payload and consulted on every read.
    //
    // The version is part of the storage key: bump `_v1` whenever the
    // /api/day response shape changes, so old-shape entries are dropped rather
    // than rendered by new code. localStorage rather than sessionStorage
    // because the win being chased is the cold open on a phone, which is a new
    // session by definition.
    const DAY_CACHE_KEY = 'promptlab_days_v1';
    const DAY_CACHE_MAX = 30;
    const dayInflight = new Map();   // one request per date, shared with prefetch

    const dayCacheAll = () => lsGet(DAY_CACHE_KEY) || {};

    function dayCacheGet(date) {
      const e = dayCacheAll()[date];
      return e && e.data ? e : null;
    }

    function dayCachePut(date, data) {
      const all = dayCacheAll();
      all[date] = { data, at: Date.now() };
      const keys = Object.keys(all);
      if (keys.length > DAY_CACHE_MAX) {   // LRU by write time
        keys.sort((a, b) => (all[a].at || 0) - (all[b].at || 0))
            .slice(0, keys.length - DAY_CACHE_MAX)
            .forEach(k => { delete all[k]; });
      }
      lsSet(DAY_CACHE_KEY, all);
    }

    function dayCacheClear() {
      try { localStorage.removeItem(DAY_CACHE_KEY); } catch { /* ignore */ }
    }

    // Lab days, never UTC (#48) — `labDay(1)` is yesterday, and the strings
    // compare lexicographically, so this covers today and yesterday.
    const dayNeedsRevalidate = (date, entry) =>
      !entry || !!entry.data.provisional || date >= labDay(1);

    function fetchDay(date) {
      if (dayInflight.has(date)) return dayInflight.get(date);
      const p = api('/api/day?date=' + encodeURIComponent(date))
        .then(d => { dayCachePut(date, d); return d; })
        .finally(() => dayInflight.delete(date));
      dayInflight.set(date, p);
      return p;
    }

    // Warm the cache without rendering. Silent and cheap: an immutable day
    // already in cache costs no request.
    function prefetchDay(date) {
      const entry = dayCacheGet(date);
      if (entry && !dayNeedsRevalidate(date, entry)) return;
      if (dayInflight.has(date)) return;
      fetchDay(date).catch(() => {});
    }

    // #48 — UTC at rest, Pacific on display.
    //
    // `toISOString()` is UTC. Using it to name a calendar day is the bug this
    // dashboard shipped with everywhere: after 5pm Pacific it returns tomorrow,
    // so the activity chart grew an `Aug 3` column on the afternoon of Aug 2 and
    // every "today" count read zero. The stored data is Pacific-day-stamped at
    // the source, so the zone is pinned rather than taken from the browser — a
    // dashboard opened from another timezone must still read Pacific days or its
    // axis stops matching its own numbers.
    //
    // `en-CA` formats as YYYY-MM-DD, so results still string-compare against a
    // `date` column and sort lexicographically. Every date bucket, axis tick and
    // window edge below comes from here.
    const LAB_TZ = 'America/Los_Angeles';
    const _labFmt = new Intl.DateTimeFormat('en-CA', { timeZone: LAB_TZ });
    const labDayOf = (d) => _labFmt.format(d);
    const labDay = (daysAgo = 0) => labDayOf(new Date(Date.now() - daysAgo * 86400_000));

    // `YYYY-MM-DDTHH:MM` on the lab's clock — for stamps a human reads back.
    // (Ask history keeps its last 20 in localStorage; entries written before
    // this fix carry a UTC stamp and age out on their own.)
    const _labStampFmt = new Intl.DateTimeFormat('en-CA', {
      timeZone: LAB_TZ, hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit',
    });
    const labStamp = (d = new Date()) => _labStampFmt.format(d).replace(', ', 'T');

    // 'fresh' (green) when the timestamp is today in Pacific, else 'stale'
    // (grey) — the header's built/synced line colors by this.
    function freshClass(dateStr) {
      if (!dateStr) return 'stale';
      try {
        const then = new Date(dateStr.includes('T') ? dateStr : dateStr + 'T00:00:00');
        return labDayOf(then) === labDay() ? 'fresh' : 'stale';
      } catch { return 'stale'; }
    }

    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const now = new Date();
      const then = new Date(dateStr.includes('T') ? dateStr : dateStr + 'T00:00:00');
      const days = Math.floor((now - then) / 86400000);
      if (days === 0) return 'today';
      if (days === 1) return 'yesterday';
      if (days < 7) return days + 'd ago';
      if (days < 30) return Math.floor(days / 7) + 'w ago';
      return Math.floor(days / 30) + 'mo ago';
    }

    function tryParseJson(str, fallback = []) {
      try { return JSON.parse(str || '[]'); } catch { return fallback; }
    }

    // ---- Machine-voice marker (wraps AI-authored text — tenet #1) ----
    function MachineText({ children, mark = true }) {
      return html`<span class="machine">${children}${mark && html`<span class="machine-mark">↳ from claude</span>`}</span>`;
    }

    // ---- Login ----
    function Login({ onLogin, passwordLogin, googleLogin }) {
      const [password, setPassword] = useState('');
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(false);

      const submit = async () => {
        setLoading(true); setError(null);
        try {
          const resp = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });
          if (resp.ok) { const d = await resp.json(); onLogin(d.role); }
          else setError('Wrong password');
        } catch (e) { setError(e.message); }
        setLoading(false);
      };

      return html`
        <div class="container">
          <div class="login">
            <h2>Prompt Lab</h2>
            <p>Sign in to continue</p>
            ${googleLogin && html`
              <button class="google-btn" onClick=${() => { window.location = '/api/login?provider=google'; }}>
                Sign in with Google
              </button>
            `}
            ${passwordLogin && html`
              <div class="login-divider">preview access</div>
              <input type="password" placeholder="Password" autofocus
                value=${password} onInput=${e => setPassword(e.target.value)}
                onKeyDown=${e => e.key === 'Enter' && submit()} />
              ${error && html`<p class="error" style="margin-bottom: 10px; padding: 0">${error}</p>`}
              <button onClick=${submit} disabled=${loading || !password}>
                ${loading ? 'Signing in...' : 'Sign in'}
              </button>
            `}
          </div>
        </div>
      `;
    }

    // ---- Project Picker (top-nav, Vercel-style) ----
    function ProjectPicker({ current, active, dormant }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('click', onDoc);
        return () => document.removeEventListener('click', onDoc);
      }, []);
      const go = (p) => { setOpen(false); navigate('#/project/' + encodeURIComponent(p)); };
      const item = (p) => html`
        <button class="picker-item ${p === current ? 'active' : ''}" onClick=${() => go(p)}>${p}</button>`;
      return html`
        <span class="picker" ref=${ref}>
          <button class="picker-btn" onClick=${() => setOpen(o => !o)}>
            <span class="picker-name">${current}</span><span class="picker-caret">▾</span>
          </button>
          ${open && html`
            <div class="picker-menu">
              ${active.length > 0 && html`<div class="picker-section">Active</div>`}
              ${active.map(item)}
              ${dormant.length > 0 && html`<div class="picker-section">Dormant</div>`}
              ${dormant.map(item)}
            </div>
          `}
        </span>
      `;
    }

    // ---- Theme (light/dark, manual override persisted over the OS preference) ----
    function getStoredTheme() {
      try { return localStorage.getItem('promptlab_theme'); } catch { return null; }
    }
    function getEffectiveTheme() {
      const stored = getStoredTheme();
      if (stored === 'light' || stored === 'dark') return stored;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem('promptlab_theme', theme); } catch { /* private mode etc. — toggle still works for this session */ }
    }

    // ---- Header ----
    // Two tiers, one declaration, rendered in both the wide row and the phone
    // menu — two hand-maintained copies is how a destination goes missing from
    // one of them.
    //
    // PRIMARY is the app: five views of the same data, visited constantly.
    // Everything else is housekeeping you touch once a week or once ever, and
    // mixing them put "Log out" the same distance from your thumb as "Costs".
    const NAV = [
      ['activity', 'Activity', '#/activity'],
      ['todos',    'Todos',    '#/todos'],
      ['costs',    'Costs',    '#/costs'],
      ['visitors', 'Visitors', '#/visitors'],
      ['health',   'Health',   '#/health'],
    ];

    function Header({ route, info, role, email, onLogout, active, dormant, refreshing, theme, onToggleTheme }) {
      const [menu, setMenu] = useState(false);
      const [more, setMore] = useState(false);
      // Health and Visitors map everything Nico runs and have no per-project
      // filter (decision 3, garm-consumer plan) — a reader never sees them in
      // nav. This is UX only: the API 403s a reader who hits the route
      // directly, so hiding the button here is not the enforcement.
      const nav = role === 'admin' ? NAV : NAV.filter(([view]) => view !== 'visitors' && view !== 'health');
      // Any navigation closes it — otherwise the panel stays open over the page
      // you just asked for, which reads as the tap not having worked.
      // A menu entry also closes it in its own handler: the effect runs after
      // paint, so the page you asked for would otherwise show a frame under
      // the still-open list.
      useEffect(() => { setMenu(false); setMore(false); }, [route.view, route.project]);
      // Clicking anywhere outside the nav closes it too. Listen on the capture
      // phase of pointerdown, not click: a click inside the page can re-render
      // its target out of the DOM before the event bubbles, and contains() then
      // reports false on a detached node — closing the panel on its own buttons.
      const navRef = useRef(null);
      useEffect(() => {
        if (!menu && !more) return;
        const onDown = (e) => {
          if (navRef.current && !navRef.current.contains(e.target)) {
            setMenu(false); setMore(false);
          }
        };
        document.addEventListener('pointerdown', onDown, true);
        return () => document.removeEventListener('pointerdown', onDown, true);
      }, [menu, more]);
      const freshness = info?.data_freshness ? timeAgo(info.data_freshness) : null;
      // build_time arrives as ISO 8601 UTC; show it in Pacific time
      // (PDT/PST handled automatically by the Intl API).
      let buildTime = '';
      if (info?.build_time) {
        try {
          const d = new Date(info.build_time);
          buildTime = new Intl.DateTimeFormat('en-US', {
            month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit',
            hour12: false,
            timeZone: 'America/Los_Angeles',
            timeZoneName: 'short',
          }).format(d);
        } catch { buildTime = info.build_time; }
      }

      // The second tier: housekeeping you touch once a week or once ever.
      // Built once and rendered in both navs so the two can't drift.
      // Chrome at the top (what this build is), destinations in the middle,
      // identity and the way out at the bottom. Two rules do the grouping \u2014
      // without them six unrelated rows read as one undifferentiated list.
      const secondary = html`
        <${Fragment}>
          ${buildTime && html`
            <div class="nav-build ${freshClass(info.build_time)}">
              <span class="nav-build-label">Built</span> ${buildTime}
            </div>`}
          <div class="nav-sep"></div>
          <button class="header-btn ${route.view === 'about' ? 'active' : ''}"
                  onClick=${() => { setMenu(false); setMore(false); navigate('#/about'); }}>About</button>
          <div class="nav-sep"></div>
          ${email && html`<span class="header-user">${email}</span>`}
          <button class="header-btn" onClick=${onLogout}>Log out</button>
        <//>`;

      // Theme lives in the primary row, not behind More: it is one tap instead
      // of two, and an icon alone can't have the "is that the mode I'm in or
      // the mode I'd get?" ambiguity that a worded label does.
      const themeBtn = html`
        <button class="header-btn theme-btn" onClick=${onToggleTheme}
                title=${theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode'}
                aria-label=${theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode'}>
          ${theme === 'light' ? '\u263E' : '\u2600'}
        </button>`;

      return html`
        <header>
          <div class="header-left ${route.view === 'project' ? 'has-picker' : ''}">
            <a class="header-logo" aria-label="Prompt Lab" onClick=${() => navigate('#/')}>
              <span class="logo-full">Prompt Lab</span><span class="logo-short" aria-hidden="true">PL</span>
            </a>
            ${route.view === 'project' && html`
              <span class="header-sep">/</span>
              <${ProjectPicker} current=${route.project} active=${active} dormant=${dormant} />
            `}
            ${refreshing && html`<span class="header-meta refreshing" title="Refreshing…">↻</span>`}
          </div>
          <div class="header-right" ref=${navRef}>
            <div class="nav-wide">
              ${nav.map(([view, label, hash]) => html`
                <button class="header-btn ${route.view === view ? 'active' : ''}"
                        onClick=${() => navigate(hash)}>${label}</button>`)}
              ${themeBtn}
              <button class="header-btn ${more ? 'active' : ''}"
                      onClick=${() => setMore(m => !m)}>More ${more ? '\u25B4' : '\u25BE'}</button>
              ${more && html`<div class="nav-more">${secondary}</div>`}
            </div>

            <!-- Phone: theme sits beside the hamburger, still one tap. -->
            <span class="theme-narrow">${themeBtn}</span>
            <button class="nav-toggle" aria-expanded=${menu} aria-label="Menu"
                    onClick=${() => setMenu(m => !m)}>
              <span style="display:inline-flex; flex-direction:column; gap:3px">
                <span style="width:16px; height:2px; background:currentColor; border-radius:1px"></span>
                <span style="width:16px; height:2px; background:currentColor; border-radius:1px"></span>
                <span style="width:16px; height:2px; background:currentColor; border-radius:1px"></span>
              </span>
              <span class="nav-toggle-label">${menu ? 'Close' : 'Menu'}</span>
            </button>

            <div class="nav-drop ${menu ? 'open' : ''}">
              ${nav.map(([view, label, hash]) => html`
                <button class="header-btn ${route.view === view ? 'active' : ''}"
                        onClick=${() => { setMenu(false); navigate(hash); }}>${label}</button>`)}
              <div class="nav-sep"></div>
              <button class="header-btn" onClick=${() => setMore(m => !m)}>
                More ${more ? '\u25B4' : '\u25BE'}
              </button>
              ${more && secondary}
            </div>
          </div>
        </header>
      `;
    }

    // ---- Skeleton Loaders ----
    function SkeletonList() {
      return html`<div>
        ${[1,2,3].map(() => html`<div class="skeleton skeleton-card"></div>`)}
      </div>`;
    }

    // ---- Main App ----
    function App() {
      const [authed, setAuthed] = useState(null);
      const [role, setRole] = useState(null);
      const [email, setEmail] = useState(null);
      const [passwordLogin, setPasswordLogin] = useState(false);
      const [googleLogin, setGoogleLogin] = useState(false);
      const [overview, setOverview] = useState(null);
      const [info, setInfo] = useState(null);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);
      const [askOpen, setAskOpen] = useState(false);
      const [theme, setTheme] = useState(getEffectiveTheme);
      const route = useRoute();

      const toggleTheme = () => {
        const next = theme === 'light' ? 'dark' : 'light';
        applyTheme(next);
        setTheme(next);
      };

      // Direct fetch (not api()) because the 401 body carries password_login,
      // which api() swallows. Server always returns role now — no fail-open.
      // Shared by mount, logout, and session expiry: the 401 branch is what
      // populates the sign-in buttons, so any path that lands on the Login
      // screen must go through here — logout used to just setAuthed(false),
      // leaving both flags false and the Login screen buttonless until reload.
      const probeAuth = useCallback(async () => {
        try {
          const resp = await fetch('/api/login');
          if (resp.ok) {
            const d = await resp.json();
            setRole(d.role); setEmail(d.email || null); setAuthed(true);
          } else {
            let pw = false, gl = false;
            try {
              const d = await resp.json();
              pw = d.password_login === true;
              gl = d.google_login === true;
            } catch { /* production-safe defaults: both false */ }
            setPasswordLogin(pw); setGoogleLogin(gl); setAuthed(false);
          }
        } catch { setAuthed(false); }
      }, []);

      useEffect(() => { probeAuth(); }, []);

      // Stale-while-revalidate: paint the cached overview immediately (no
      // skeleton), then refetch in the background and swap in fresh data.
      const loadOverview = useCallback(async () => {
        const cached = lsGet('promptlab_overview');
        if (cached) { setOverview(cached); setLoading(false); setRefreshing(true); }
        else { setLoading(true); }
        setError(null);
        try {
          const data = await api('/api/overview');
          setOverview(data); lsSet('promptlab_overview', data);
        } catch (e) {
          if (e.message === 'unauthorized') { probeAuth(); return; }
          if (!cached) setError(e.message);  // keep stale data on a refresh error
        }
        setLoading(false); setRefreshing(false);
      }, [probeAuth]);

      useEffect(() => {
        if (authed) {
          loadOverview();
          api('/api/info').then(setInfo).catch(() => {});
        }
      }, [authed]);

      // Prefetch the most-recently-active project so opening it is instant.
      useEffect(() => {
        if (!overview) return;
        const bp = overview.by_project || {};
        const top = Object.keys(bp).sort((a, b) =>
          (bp[b]?.summaries?.[0]?.date || '').localeCompare(bp[a]?.summaries?.[0]?.date || ''))[0];
        if (top && !memo.project.has(top)) {
          api('/api/project?name=' + encodeURIComponent(top))
            .then(d => memo.project.set(top, d)).catch(() => {});
        }
      }, [overview]);

      // Prefetch the days a chart tap is most likely to land on (#50): today
      // and the two before it. Deliberately three and not thirty — the point
      // is an instant day page for the taps that actually happen, not a warm
      // cache of the whole month. Runs at idle so it never competes with the
      // overview fetch that paints the home screen.
      useEffect(() => {
        if (!authed) return;
        const run = () => { for (let i = 0; i < 3; i++) prefetchDay(labDay(i)); };
        if (window.requestIdleCallback) {
          const h = window.requestIdleCallback(run, { timeout: 3000 });
          return () => window.cancelIdleCallback && window.cancelIdleCallback(h);
        }
        const t = setTimeout(run, 1200);   // Safari has no requestIdleCallback
        return () => clearTimeout(t);
      }, [authed]);

      // Keyboard shortcut: / to open Ask (admin only)
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT' && role === 'admin') {
            e.preventDefault();
            setAskOpen(true);
          }
          if (e.key === 'Escape') setAskOpen(false);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [role]);

      // Metadata edits (issue #23) write straight to Turso, so merge the result
      // back into the overview + its cache rather than refetching everything.
      const onMetaChange = useCallback((project, meta) => {
        setOverview(o => {
          if (!o) return o;
          const next = { ...o, project_metadata: { ...(o.project_metadata || {}), [project]: meta } };
          lsSet('promptlab_overview', next);
          return next;
        });
      }, []);

      const logout = async () => {
        await fetch('/api/login', { method: 'DELETE' });
        // Clear caches so a different login never sees the prior user's data.
        memo.project.clear(); memo.cost.clear(); dayCacheClear();
        try { localStorage.removeItem('promptlab_overview'); } catch { /* ignore */ }
        setOverview(null); setEmail(null); setRole(null);
        await probeAuth();  // 401 branch populates the sign-in buttons
      };

      if (authed === null) return html`<div class="loading">Loading...</div>`;
      if (!authed) return html`<${Login} passwordLogin=${passwordLogin} googleLogin=${googleLogin}
        onLogin=${(r) => { setRole(r); setEmail(null); setAuthed(true); }} />`;

      // Project lists for the top-nav picker. An explicitly set status (issue
      // #23) wins; with none set, dormancy is derived from 7-day activity as
      // it always was, so un-annotated projects group exactly as before.
      const bp = overview?.by_project || {};
      const byRecency = (a, b) =>
        (bp[b]?.summaries?.[0]?.date || '').localeCompare(bp[a]?.summaries?.[0]?.date || '');
      const known = [...new Set([...Object.keys(bp), ...(overview?.all_projects || [])])];
      const active = known.filter(p => projectStatus(overview, p) === 'active').sort(byRecency);
      const dormant = known.filter(p => projectStatus(overview, p) !== 'active').sort();

      return html`
        <div class="container">
          <${Header} route=${route} info=${info} role=${role} email=${email} onLogout=${logout}
            active=${active} dormant=${dormant} refreshing=${refreshing}
            theme=${theme} onToggleTheme=${toggleTheme} />

          ${loading && !overview && html`<${SkeletonList} />`}
          ${error && html`
            <div class="error">
              <p>${error}</p>
              <button onClick=${loadOverview} style="margin-top: 10px; padding: 6px 14px;
                background: var(--accent); color: white; border: none; border-radius: var(--radius);
                cursor: pointer; font-size: 1.16rem;">Retry</button>
            </div>
          `}

          ${overview && route.view === 'home' && html`
            <${HomeView} overview=${overview} role=${role} />
          `}
          ${overview && route.view === 'project' && html`
            <${ProjectPage} name=${route.project} overview=${overview} section=${route.section}
              role=${role} onMetaChange=${onMetaChange} />
          `}
          ${route.view === 'costs' && html`<${CostsOverview} />`}
          ${route.view === 'activity' && html`<${ActivityOverview} metric=${route.metric} />`}
          ${route.view === 'day' && html`<${DayView} date=${route.date} />`}
          ${route.view === 'about' && html`<${AboutView} info=${info}
            onAsk=${role === 'admin' ? () => setAskOpen(true) : null} />`}
          ${route.view === 'visitors' && (role === 'admin'
            ? html`<${VisitorsOverview} />`
            : html`<p style="color: var(--text-secondary); padding: 24px 0">Admins only.</p>`)}
          ${route.view === 'todos' && html`<${TodosView} overview=${overview} />`}
          ${route.view === 'health' && (role === 'admin'
            ? html`<${HealthView} onUnauthorized=${() => setAuthed(false)} />`
            : html`<p style="color: var(--text-secondary); padding: 24px 0">Admins only.</p>`)}

          ${askOpen && html`<${AskModal} overview=${overview} project=${route.view === 'project' ? route.project : null} onClose=${() => setAskOpen(false)} />`}
        </div>
      `;
    }

    // An explicitly set status (issue #23) wins; with none set, dormancy is
    // derived from 7-day activity as it always was, so un-annotated projects
    // behave exactly as before.
    function projectStatus(overview, p) {
      return overview?.project_metadata?.[p]?.status
        || ((overview?.by_project || {})[p] ? 'active' : 'dormant');
    }

    // ---- Distill a summary row into a short phrase ----
    function distillPhrase(s) {
      const decisions = tryParseJson(s.key_decisions);
      if (decisions.length > 0) return decisions[0];
      const words = (s.summary || '').split(' ');
      return words.slice(0, 12).join(' ') + (words.length > 12 ? '...' : '');
    }

    // ---- Home: Pulse (metrics-first) over the activity stream ----

    // Inline SVG sparkline from a value series. Returns null-safe markup.
    function Spark({ values, color, w = 96, h = 28 }) {
      if (!values || values.length < 2) return null;
      const max = Math.max(...values, 1);
      const n = values.length;
      const pts = values.map((v, i) =>
        `${(i / (n - 1)) * w},${h - (v / max) * (h - 3) - 1}`);
      const last = pts[pts.length - 1].split(',');
      return html`
        <svg width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} preserveAspectRatio="none"
             style="display:block; overflow:visible">
          <polyline points=${`0,${h} ${pts.join(' ')} ${w},${h}`}
            fill=${color} opacity="0.1" stroke="none" />
          <polyline points=${pts.join(' ')} fill="none" stroke=${color}
            stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
          <circle cx=${last[0]} cy=${last[1]} r="2" fill=${color} />
        </svg>`;
    }

    // Sum activity_by_project into one {date -> prompts} series over a date span.
    function dailySeries(activityByProject, days) {
      const byDate = {};
      for (const p of Object.keys(activityByProject || {})) {
        for (const d of activityByProject[p] || []) {
          byDate[d.date] = (byDate[d.date] || 0) + (d.prompts || 0);
        }
      }
      const out = [];
      for (let i = days - 1; i >= 0; i--) {
        const ds = labDay(i);
        out.push({ date: ds, n: byDate[ds] || 0 });
      }
      return out;
    }

    // KPI tile row. Numbers we already have (week totals, active count) render
    // instantly; spend + views fill in when their endpoints resolve.
    function PulseTiles({ overview, cost30, views30, hide, role }) {
      const [showProjects, setShowProjects] = useState(false);
      const week = overview.week || {};
      const bp = overview.by_project || {};
      const known = [...new Set([
        ...Object.keys(bp), ...(overview.all_projects || [])])];
      // Same split + ordering as the top-nav picker: explicit status (issue
      // #23) wins, otherwise dormancy is derived from 7-day activity.
      const byRecency = (a, b) =>
        (bp[b]?.summaries?.[0]?.date || '').localeCompare(bp[a]?.summaries?.[0]?.date || '');
      const activeList = known.filter(p => projectStatus(overview, p) === 'active').sort(byRecency);
      const dormantList = known.filter(p => projectStatus(overview, p) !== 'active').sort();
      const activeCount = activeList.length;
      const dormantCount = dormantList.length;

      const promptSeries = dailySeries(overview.activity_by_project, 30).map(d => d.n);

      const spend30 = (cost30 || []).reduce((s, r) => s + (Number(r.cost_usd) || 0), 0);
      const spendByDate = {};
      for (const r of (cost30 || [])) spendByDate[r.date] = (spendByDate[r.date] || 0) + (Number(r.cost_usd) || 0);
      const spendSeries = [];
      for (let i = 29; i >= 0; i--) {
        const ds = labDay(i);
        spendSeries.push(spendByDate[ds] || 0);
      }

      const views30sum = (views30 || []).reduce((s, r) => s + (Number(r.views) || 0), 0);
      const viewsByDate = {};
      for (const r of (views30 || [])) viewsByDate[r.date] = (viewsByDate[r.date] || 0) + (Number(r.views) || 0);
      const viewsSeries = [];
      for (let i = 29; i >= 0; i--) {
        const ds = labDay(i);
        viewsSeries.push(viewsByDate[ds] || 0);
      }

      const tiles = [
        { label: 'active projects', value: activeCount, sub: dormantCount + ' dormant',
          to: null, expands: true },
        { label: 'sessions · 7d', value: (week.sessions || 0).toLocaleString(), to: '#/activity/sessions' },
        { label: 'prompts · 7d', value: (week.prompts || 0).toLocaleString(),
          series: promptSeries, color: 'var(--accent-light)', to: '#/activity/prompts' },
        { label: 'commits · 7d', value: (week.commits || 0).toLocaleString(), to: '#/activity/commits' },
        { label: 'api spend · 30d', value: cost30 == null ? '…' : fmtUsd(spend30),
          series: cost30 == null ? null : spendSeries, color: 'var(--green)', to: '#/costs' },
      ];
      // Visitors is admin-only (decision 3) — a reader's fetch always 403s,
      // so the tile is dropped rather than linking to a page that dead-ends
      // on "Admins only."
      if (role === 'admin') {
        tiles.push({ label: 'page views · 30d',
          value: views30 == null ? '…' : (views30sum ? views30sum.toLocaleString() : 'new'),
          series: views30 == null ? null : viewsSeries, color: '#06b6d4', to: '#/visitors' });
      }

      // Chip list shared by both halves of the inline expansion (same visual
      // vocabulary as home's dormant chip list); anchors, so keyboard reaches
      // every project without a hover.
      // A project the private toggle is hiding must not have its NAME appear
      // anywhere on screen (same rule the stream and the cross-project chart
      // follow) — so it drops out of the chip list and is reported as a count.
      const chips = (list, muted) => {
        const shown = hide?.size ? list.filter(p => !hide.has(p)) : list;
        const hidden = list.length - shown.length;
        return html`
          <div class="dormant-list">
            ${shown.map(p => html`

                                         color:var(--text-secondary)">${t.sub}</div>`

                </div>`;
              const cls = 'kpi-tile' + (isAction ? ' kpi-tile-action' : '');
              // Navigates → persistent ↗. Toggles → chevron that rotates, and a
              // real <button> so it's keyboard-operable and announces its state.
              if (t.to) {
                return html`

                  <button class=${cls} type="button" aria-expanded=${showProjects ? 'true' : 'false'}
                          onClick=${() => setShowProjects(v => !v)}
                          title=${showProjects ? 'Hide project lists' : 'Show active and dormant projects'}>
                    <span class="kpi-cue ${showProjects ? 'open' : ''}" aria-hidden="true">▾</span>${inner}
                  </button>`;
              }
              return html`<div class=${cls}>${inner}</div>`;
            })}
          </div>

          ${showProjects && html`
            <div style="margin-bottom:22px; padding:14px 16px; background:var(--card);
                        border:1px solid var(--border); border-radius:var(--radius)">
              <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px">
                <div style="font-family:'SF Mono',ui-monospace,monospace; font-size:0.93rem;
                            letter-spacing:0.14em; text-transform:uppercase; color:var(--text-secondary)">
                  Active · ${activeCount}
                </div>
                <button onClick=${() => setShowProjects(false)}
                  style="background:none; border:none; color:var(--text-secondary); font-size:1.2rem;
                         line-height:1; cursor:pointer; font-family:inherit" title="Collapse">×</button>
              </div>
              ${activeCount === 0
                ? html`<div style="font-size:1.06rem; color:var(--text-secondary); padding:8px 0">None.</div>`
                : chips(activeList, false)}

                          letter-spacing:0.14em; text-transform:uppercase; color:var(--text-secondary);
                          margin-top:16px">
                Dormant · ${dormantCount}

                ? html`<div style="font-size:1.06rem; color:var(--text-secondary); padding:8px 0">None.</div>`
