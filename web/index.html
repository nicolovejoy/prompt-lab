    // ---- Health (ecosystem target status, issue #34) ----
    // Reads /api/health_report?dry=1 — the same endpoint the daily cron email
    // uses, in its read-only preview mode: it polls every target live at
    // request time (~1-2s) and sends nothing. Deliberately un-cached; a
    // remembered "up" is worse than a spinner.

    // ISO 8601 UTC -> Pacific, same shape as the header's build stamp.
    function fmtPacific(iso) {
      try {
        return new Intl.DateTimeFormat('en-US', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
          hour12: false, timeZone: 'America/Los_Angeles', timeZoneName: 'short',
        }).format(new Date(iso));
      } catch { return String(iso); }
    }

    function HealthView({ onUnauthorized }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [checkedAt, setCheckedAt] = useState(null);
      const [nonce, setNonce] = useState(0);  // bumped by the ↻ control

      useEffect(() => {
        let alive = true;
        setLoading(true); setError(null);
        // retries=0: the request already spends 1-2s polling targets, so an
        // auto-retry would double the wait before the user sees anything.
        api('/api/health_report?dry=1', 0)
          .then(d => { if (alive) { setData(d); setCheckedAt(new Date()); setLoading(false); } })
          .catch(e => {
            if (!alive) return;
            if (e.message === 'unauthorized') { onUnauthorized && onUnauthorized(); return; }
            setError(e.message === 'HTTP 403'
              ? "This deploy won't serve the health report to your account (403)."
              : e.message);
            setLoading(false);
          });
        return () => { alive = false; };
      }, [nonce]);

      const targets = Array.isArray(data?.targets) ? data.targets : [];
      const down = targets.filter(t => !t.ok);
      // ok is tri-state: true fresh, false stale/never, null couldn't check.
      // Compare against false explicitly — a null must not read as stale, and
      // must not read as fresh either.
      const heartbeats = Array.isArray(data?.heartbeats) ? data.heartbeats : [];
      const stale = heartbeats.filter(h => h.ok === false);
      const unchecked = heartbeats.filter(h => h.ok == null);
      const pausedUntil = data?.paused_until;
      const paused = !!(pausedUntil && new Date(pausedUntil).getTime() > Date.now());

      const header = html`
        <div style="display: flex; justify-content: space-between; align-items: baseline;
                    flex-wrap: wrap; gap: 8px 12px; margin-bottom: 4px">
          <h1 style="margin: 0; font-size: 1.91rem; color: var(--accent-light)">Health</h1>
          <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
            ${loading && html`<span class="header-meta refreshing" title="Polling…">↻</span>`}
            ${!loading && checkedAt && html`
              <span style="font-size: 0.89rem; color: var(--text-secondary);
                           font-family: 'SF Mono', ui-monospace, monospace">
                checked ${checkedAt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false })}
              </span>`}
            <button class="tap" onClick=${() => setNonce(n => n + 1)} disabled=${loading}
              title="Poll every target again"
              style="font-size: 0.95rem; padding: 4px 12px; border-radius: 4px; cursor: pointer;
                     font-family: inherit; border: 1px solid var(--border);
                     background: transparent; color: var(--text-secondary);
                     opacity: ${loading ? 0.5 : 1}">
              ↻ re-poll
            </button>
          </div>
        </div>
        <${PageNote}>
          <div style="font-size: 1.06rem; color: var(--text-secondary); margin-bottom: 18px">
            Live poll of each target's health endpoint — the same check behind the
            daily 8am Pacific email. Alerting lives in UptimeRobot, deliberately
            off this stack; this page is the read-only view.
          </div>
        <//>`;

      if (loading && !data) return html`<div>${header}
        <div class="cost-placeholder">Polling targets…</div></div>`;
      if (error) return html`<div>${header}
        <div class="cost-placeholder">Couldn't load the health report. (${error})
          <div style="margin-top: 10px">
            <button onClick=${() => setNonce(n => n + 1)}
              style="font-size: 1.06rem; padding: 6px 14px; background: var(--accent); color: #fff;
                     border: none; border-radius: var(--radius); cursor: pointer; font-family: inherit">
              Retry
            </button>
          </div>
        </div>
        <${UptimeArchive} onUnauthorized=${onUnauthorized} />
      </div>`;

      const banner = (bg, fg, children) => html`
        <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
                    padding: 10px 14px; margin-bottom: 16px; border-radius: var(--radius);
                    background: ${bg}; border: 1px solid ${fg}; color: ${fg};
                    font-size: 1.06rem; line-height: 1.5">${children}</div>`;

      return html`
        <div>
          ${header}

          ${paused && banner('var(--yellow-dim)', 'var(--yellow)', html`
            <span>⏸</span>
            <span><strong>Health emails paused until ${fmtPacific(pausedUntil)}</strong>
              — checks still run, only the daily email is suppressed.</span>`)}

          ${down.length > 0 && banner('var(--red-dim)', 'var(--red)', html`
            <span>⚠</span>
            <span><strong>${down.length} target${down.length === 1 ? '' : 's'} DOWN</strong>
              — ${down.map(t => t.name).join(', ')}</span>`)}

          ${stale.length > 0 && banner('var(--yellow-dim)', 'var(--yellow)', html`
            <span>⏳</span>
            <span><strong>${stale.length} stale artifact${stale.length === 1 ? '' : 's'}</strong>
              — ${stale.map(h => h.name).join(', ')}</span>`)}

          <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; flex-wrap: wrap">
            <div style="font-size: 2.18rem; font-weight: 700; color: var(--accent-light)">
              ${targets.length - down.length}/${targets.length}
            </div>
            <div style="font-size: 1.06rem; color: var(--text-secondary)">
              target${targets.length === 1 ? '' : 's'} up
              ${paused ? ' · email paused' : (data?.would_send === false ? ' · email suppressed' : '')}
            </div>
          </div>

          ${targets.length === 0
            ? html`<div class="empty">No targets configured. Add one to
                <code>TARGETS</code> in <code>web/api/health_report.py</code>.</div>`
            : html`
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                          gap: 12px">
                ${targets.map(t => {
                  const ok = !!t.ok;
                  const status = t.status == null ? 'no response' : 'HTTP ' + t.status;
                  const ms = Number(t.ms);
                  return html`
                    <div style="background: var(--card); border: 1px solid ${ok ? 'var(--border)' : 'var(--red)'};
                                border-left: 3px solid ${ok ? 'var(--green)' : 'var(--red)'};
                                border-radius: var(--radius); padding: 13px 15px">
                      <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap">
                        <span style="font-size: 1.3rem; font-weight: 600; word-break: break-word">${t.name}</span>
                        <span style="margin-left: auto; font-size: 0.89rem; font-weight: 700;
                                     letter-spacing: 0.06em; padding: 2px 8px; border-radius: 3px;
                                     white-space: nowrap;
                                     background: ${ok ? 'var(--green-dim)' : 'var(--red-dim)'};
                                     color: ${ok ? 'var(--green)' : 'var(--red)'}">
                          ${ok ? '● UP' : '⚠ DOWN'}
                        </span>
                      </div>
                      <div style="margin-top: 6px; font-size: 1.02rem; color: var(--text-secondary);
                                  font-family: 'SF Mono', ui-monospace, monospace">
                        ${status}${Number.isFinite(ms) ? ' · ' + ms.toLocaleString() + 'ms' : ''}
                      </div>
                      ${t.note && html`
                        <div style="margin-top: 6px; font-size: 1.02rem; color: var(--text-secondary);
                                    line-height: 1.5; word-break: break-word">${t.note}</div>`}
                    </div>`;
                })}
              </div>`}

          ${heartbeats.length > 0 && html`
            <div style="margin-top: 26px">
              <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
                          margin-bottom: 4px">
                <h2 style="margin: 0; font-size: 1.3rem">Heartbeats</h2>
                <span style="font-size: 1.02rem; color: ${stale.length || unchecked.length
                    ? 'var(--yellow)' : 'var(--green)'}">
                  ${stale.length || unchecked.length
                    ? `${stale.length} stale${unchecked.length ? `, ${unchecked.length} unchecked` : ''}`
                    : `all ${heartbeats.length} fresh`}
                </span>
              </div>
              <div style="font-size: 1.02rem; color: var(--text-secondary); margin-bottom: 12px;
                          line-height: 1.5">
                Age of each recurring job's real output, not whether the job reported success —
                a job that dies never gets to tell you.
              </div>
              <div style="display: grid; gap: 8px">
                ${heartbeats.map(h => {
                  // null = couldn't read Turso. Deliberately its own state:
                  // showing it as fresh would manufacture confidence, showing
                  // it as stale would cry wolf on an outage of the checker.
                  const state = h.ok === true ? 'fresh' : h.ok === false ? 'STALE' : 'UNCHECKED';
                  const color = h.ok === true ? 'var(--green)'
                    : h.ok === false ? 'var(--red)' : 'var(--text-secondary)';
                  const dim = h.ok === true ? 'var(--green-dim)'
                    : h.ok === false ? 'var(--red-dim)' : 'transparent';
                  return html`
                    <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
                                background: var(--card); border: 1px solid var(--border);
                                border-left: 3px solid ${color};
                                border-radius: var(--radius); padding: 9px 13px">
                      <span style="font-size: 1.13rem; font-weight: 600">${h.name}</span>
                      <span style="font-size: 0.89rem; font-weight: 700; letter-spacing: 0.06em;
                                   padding: 2px 8px; border-radius: 3px; white-space: nowrap;
                                   background: ${dim}; color: ${color}">${state}</span>
                      <span style="margin-left: auto; font-size: 1.02rem; text-align: right;
                                   color: var(--text-secondary);
                                   font-family: 'SF Mono', ui-monospace, monospace">
                        ${h.last ? `${h.last} · ${h.age_days}d` : '—'}
                        <span style="opacity: 0.7"> / ${h.max_age_days}d</span>
                      </span>
                      ${h.note && html`
                        <div style="flex-basis: 100%; font-size: 1.02rem; color: ${color};
                                    line-height: 1.5">${h.note}</div>`}
                    </div>`;
                })}
              </div>
            </div>`}

          <${UptimeArchive} onUnauthorized=${onUnauthorized} />

          <div style="margin-top: 18px; font-size: 0.95rem; color: var(--text-secondary); line-height: 1.5">
            Targets, heartbeats, and thresholds live in <code>web/api/health_report.py</code>;
            the convention each app implements is <code>docs/health-convention.md</code>.
          </div>
        </div>`;
    }

    // ---- Uptime archive (#/health, phase 2 of docs/plan-2026-08-01-uptime-dashboard.md) ----
    // Reads /api/uptime_overview — the daily archive the health cron writes from
    // UptimeRobot's v2 ratios (one row per monitor per day). Unlike the live
    // targets above this section MAY serve from the in-session memo: a
    // remembered history is still true, a remembered "up" is not.
    const uptimeOverviewMemo = new Map();  // window(days) -> payload

    // A day is a fixed-height tick colored by its ratio, not a height-encoded
    // bar — 99.9% and 100% are indistinguishable by height and the difference
    // between them is the whole point. A day with no row is grey, never 0%: the
    // archive starts empty and is deliberately never backfilled (UptimeRobot
    // exposes rolling ratios, not per-day history), so a gap means missing
    // data, not downtime.
    // Grey for "no row" is --text-secondary held down by opacity, not --border:
    // --border on --card is ~invisible in BOTH themes (#e5e5e5 on #fff,
    // #2a2a2a on #1a1a1a), so a gap would read as nothing at all.
    const NO_DATA_COLOR = 'var(--text-secondary)';
    const NO_DATA_OPACITY = 0.6;   // ~3:1 against the card in both themes
    function uptimeColor(u) {
      if (u == null) return NO_DATA_COLOR;
      if (u >= 99.9) return 'var(--green)';
      if (u >= 99) return 'var(--yellow)';
      return 'var(--red)';
    }
    function fmtPct(u) {
      const n = Number(u);
      if (u == null || !Number.isFinite(n)) return '—';
      return (Number.isInteger(n) ? n.toFixed(0) : n.toFixed(2)) + '%';
    }
    function fmtMs(v) {
      const n = Number(v);
      return Number.isFinite(n) && n > 0 ? Math.round(n).toLocaleString('en-US') + 'ms' : '—';
    }
    function isoDaysAgo(i) {
      return labDay(i);
    }

    // One card per monitor: rolling ratios, a per-day uptime strip, and the
    // response-time trend under it on the same axis and the same scroll.
    //
    // On a phone twelve open cards made Health eight screens long, so each
    // card starts as one row (name, status, 30d ratio) and opens in place.
    // Its chart buckets like every other chart; a bucket's strip colour is its
    // WORST day and its response bar the mean (see bucketUptime).
    function MonitorUptimeCard({ monitor, dates, days, open = false, onToggle }) {
      const narrow = useNarrow();
      const scrollRef = useRef(null);
      const [hovered, setHovered] = useState(null);

      const size = bucketSizeFor(days, narrow);
      const buckets = bucketDates(dates, size);
      const n = buckets.length;
      const { selected, rowRef, onPointerDown, onPointerMove, endGesture, onBarClick } =
        useBarSelection(days + '|' + dates.length + '|' + narrow, buckets);

      // Charts open at the recent (right) end — browsers default scrollLeft to
      // 0, which on a young archive is nothing but grey (issue #19).
      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollLeft = scrollRef.current.scrollWidth;
      }, [n, monitor.name, (monitor.series || []).length, open]);

      // The series is sparse by construction (only days the cron ran), so index
      // it and read the zero-filled calendar axis off `dates`. Number() on every
      // field: Turso hands aggregates back as strings and a string here would
      // silently break both the color buckets and the bar math. A missing
      // response is null, not 0, so it cannot pull a bucket's mean down.
      const byDate = {};
      for (const p of (Array.isArray(monitor.series) ? monitor.series : [])) {
        if (!p || !p.date) continue;
        const u = p.uptime == null ? null : Number(p.uptime);
        const ms = p.ms == null ? null : Number(p.ms);
        byDate[p.date] = {
          uptime: Number.isFinite(u) ? u : null,
          ms: Number.isFinite(ms) ? ms : null,
        };
      }
      const points = Object.keys(byDate).length;

      const status = String(monitor.status || '').toUpperCase();
      const up = status === 'UP' || status === '';
      const paused = status === 'PAUSED';
      const chipColor = paused ? 'var(--text-secondary)' : up ? 'var(--green)' : 'var(--red)';
      const chipBg = paused ? 'transparent' : up ? 'var(--green-dim)' : 'var(--red-dim)';

      const stat = (label, value, color) => html`
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 62px">
          <span style="font-size: 0.82rem; color: var(--text-secondary);
                       font-family: 'SF Mono', ui-monospace, monospace">${label}</span>
          <span style="font-size: 1.13rem; font-variant-numeric: tabular-nums;
                       color: ${color || 'var(--text)'}">${value}</span>
        </div>`;

      const badge = html`
        <span style="font-size: 0.89rem; font-weight: 700; letter-spacing: 0.06em;
                     padding: 2px 8px; border-radius: 3px; white-space: nowrap;
                     background: ${chipBg}; color: ${chipColor}">${status || '—'}</span>`;
      const stats = html`
        <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px">
          ${stat('1d', fmtPct(monitor.uptime_1d), uptimeColor(monitor.uptime_1d))}
          ${stat('7d', fmtPct(monitor.uptime_7d), uptimeColor(monitor.uptime_7d))}
          ${stat('30d', fmtPct(monitor.uptime_30d), uptimeColor(monitor.uptime_30d))}
          ${stat('avg response', fmtMs(monitor.avg_response_ms))}
        </div>`;
      const head = html`
        <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap">
          <span style="font-size: 1.13rem; font-weight: 600; word-break: break-word">${monitor.name}</span>
          ${badge}
        </div>
        ${stats}`;

      // A collapsed row must still show a problem: a 30d ratio under 100 is
      // drawn in the warning colour (red under 99, as the strip does), so a bad
      // month is visible without opening anything.
      const r30 = Number(monitor.uptime_30d);
      const r30Color = monitor.uptime_30d == null || !Number.isFinite(r30) ? 'var(--text-secondary)'
        : r30 < 99 ? 'var(--red)' : r30 < 100 ? 'var(--yellow)' : 'var(--text-secondary)';
      const toggle = html`
        <button data-test="uptime-toggle" class="uptime-toggle" aria-expanded=${open ? 'true' : 'false'}
                onClick=${onToggle}>
          <span class="uptime-toggle-name">${monitor.name}</span>
          ${badge}
          <span style="font-variant-numeric: tabular-nums; color: ${r30Color}">
            ${fmtPct(monitor.uptime_30d)}
          </span>
          <span aria-hidden="true" style="color: var(--text-secondary); width: 1em; text-align: center">
            ${open ? '▾' : '▸'}
          </span>
        </button>`;

      // Wide: the card as it always was. Narrow: the one-line row, and under
      // it, only once opened, the ratios and the chart.
      const card = (children) => narrow
        ? html`
          <div data-test="uptime-card" data-monitor=${monitor.name}
               style="background: var(--card); border: 1px solid var(--border);
                      border-left: 3px solid ${chipColor}; border-radius: var(--radius);
                      padding: 0 12px; margin-top: 10px">
            ${toggle}
            ${open && html`
              <div data-test="uptime-detail" style="padding-bottom: 13px">
                <div style="margin-top: -8px">${stats}</div>${children}
              </div>`}
          </div>`
        : html`
          <div data-test="uptime-card" data-monitor=${monitor.name}
               style="background: var(--card); border: 1px solid var(--border);
                      border-left: 3px solid ${chipColor}; border-radius: var(--radius);
                      padding: 13px 15px; margin-top: 10px">${head}<div data-test="uptime-detail">${children}</div></div>`;

      // A monitor the archive hasn't reached yet gets a sentence, not an empty
      // chart — the grid would otherwise read as "all down".
      if (points === 0) {
        return card(html`
          <div style="margin-top: 10px; font-size: 1.02rem; color: var(--text-secondary); line-height: 1.5">
            No archived days yet — the ratios above are the latest pull, the trend needs a second day.
          </div>`);
      }

      const STRIP_H = 22, MS_H = 54;
      const cells = buckets.map((b) => ({
        ...bucketUptime(b, byDate),
        // "Archived" is whether the day has a row at all, as before buckets:
        // a row with no reading still is not a gap.
        has: b.dates.some((d) => byDate[d]),
      }));
      const peakMs = Math.max(...cells.map((c) => c.ms || 0), 1);

      const detail = (d) => {
        const v = byDate[d];
        return html`
          <div style="font-weight: 600; margin-bottom: 4px">${fmtShortDate(d)}</div>
          ${v ? html`
            <div style="display: flex; align-items: center; gap: 6px; color: var(--text-secondary)">
              <span style="width: 8px; height: 8px; border-radius: 2px; flex: none;
                           background: ${uptimeColor(v.uptime)}; display: inline-block"></span>
              <span style="color: var(--text)">uptime</span>
              <span style="margin-left: auto">${fmtPct(v.uptime)}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px; color: var(--text-secondary)">
              <span style="width: 8px; height: 8px; border-radius: 2px; flex: none;
                           background: var(--accent); display: inline-block"></span>
              <span style="color: var(--text)">response</span>
              <span style="margin-left: auto">${fmtMs(v.ms)}</span>
            </div>`
            : html`<div style="color: var(--text-secondary)">not archived</div>`}`;
      };

      // The readout's rows for a selected bucket. "lowest of N days" says why a
      // week with one bad day is not green.
      const readoutBody = (c, b) => (c.has ? html`
        <div class="chart-readout-row">
          <span class="chart-readout-swatch" style="background: ${uptimeColor(c.uptime)}"></span>
          <span class="chart-readout-name">uptime${b.dates.length > 1 && c.days > 0 ? html`
            <span style="color: var(--text-secondary)"> · lowest of ${c.days} day${c.days === 1 ? '' : 's'}</span>` : ''}</span>
          <span class="chart-readout-value">${fmtPct(c.uptime)}</span>
        </div>
        <div class="chart-readout-row">
          <span class="chart-readout-swatch" style="background: var(--accent)"></span>
          <span class="chart-readout-name">response${b.dates.length > 1 && c.ms != null ? html`
            <span style="color: var(--text-secondary)"> · mean</span>` : ''}</span>
          <span class="chart-readout-value">${fmtMs(c.ms)}</span>
        </div>`
        : html`<div class="chart-readout-more">not archived</div>`);

      const row = html`
        <div data-test="chart-bars" ref=${rowRef} class=${narrow ? 'chart-bars narrow' : 'chart-bars'}
             style="display: flex; gap: 2px; border-bottom: 1px solid var(--border)"
             onPointerDown=${onPointerDown} onPointerMove=${onPointerMove}
             onPointerUp=${endGesture} onPointerCancel=${endGesture}>
          ${buckets.map((b, i) => {
            const c = cells[i];
            const msH = c.ms > 0 ? Math.max(1, Math.round((c.ms / peakMs) * (MS_H - 2))) : 0;
            const active = hovered === i || selected === i;
            const dim = selected != null && selected !== i;
            const edge = n > 1 ? i / (n - 1) : 0.5;
            const tipAnchor = edge < 0.15 ? 'left' : edge > 0.85 ? 'right' : 'center';
            return html`
              <div data-test="chart-bar" data-key=${b.key} data-selected=${selected === i ? 'true' : undefined}
                   style="flex: 1; min-width: 3px; position: relative; cursor: pointer"
                   onPointerEnter=${(e) => { prefetchDay(b.dates[b.dates.length - 1]); if (e.pointerType === 'mouse') setHovered(i); }}
                   onPointerLeave=${() => setHovered(h => h === i ? null : h)}
                   onClick=${(e) => onBarClick(e, i)}>
                <div style="height: ${STRIP_H}px; border-radius: 2px;
                            background: ${uptimeColor(c.has ? c.uptime : null)};
                            opacity: ${dim ? 0.45 : c.has ? (active ? 1 : 0.85) : (active ? 0.85 : NO_DATA_OPACITY)};
                            transition: opacity 0.1s"></div>
                <div style="height: ${MS_H}px; margin-top: 6px; position: relative">
                  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: ${msH}px;
                              background: var(--accent); border-radius: 2px 2px 0 0;
                              opacity: ${dim ? 0.35 : active ? 1 : 0.75}; transition: opacity 0.1s"></div>
                </div>
                ${CAN_HOVER && hovered === i && b.size === 'day' && html`
                  <div style="position: absolute; bottom: 100%; z-index: 5; margin-bottom: 4px;
                              ${tipAnchor === 'left' ? 'left: 0' : tipAnchor === 'right' ? 'right: 0' : 'left: 50%; transform: translateX(-50%)'};
                              background: var(--bg); border: 1px solid var(--border);
                              border-radius: 6px; padding: 8px 10px; white-space: nowrap;
                              box-shadow: 0 4px 16px rgba(0,0,0,0.4); font-size: 0.95rem">
                    ${detail(b.key)}
                  </div>`}
              </div>`;
          })}
        </div>`;
      const axis = html`<${DateAxis} dates=${buckets.map((b) => b.key)}
                                     fmt=${(k) => axisLabel(buckets.find((b) => b.key === k))}
                                     style="margin-top: 4px" />`;
      const sel = selected != null ? buckets[selected] : null;

      return card(html`
        <div data-test="chart" data-chart=${'uptime-' + monitor.name}>
          <div style="margin-top: 10px; display: grid; grid-template-columns: 56px ${narrow ? 'minmax(0, 1fr)' : '1fr'}; gap: 8px">
            <div style="font-size: 0.75rem; color: var(--text-secondary);
                        font-family: 'SF Mono', ui-monospace, monospace">
              <div style="height: ${STRIP_H}px; display: flex; align-items: center; justify-content: flex-end">
                uptime
              </div>
              <div style="height: ${MS_H}px; margin-top: 6px; display: flex; flex-direction: column;
                          justify-content: space-between; align-items: flex-end">
                <span>${Math.round(peakMs).toLocaleString('en-US')}ms</span>
                <span>0</span>
              </div>
            </div>
            ${narrow
              ? html`<div>${row}${axis}</div>`
              : html`
                <div class="chart-scroll" ref=${scrollRef}>
                  <div style="min-width: ${n * 7}px">${row}${axis}</div>
                </div>`}
          </div>
          ${sel && html`<${ChartReadout} bucket=${sel} heading=${sel.label} segs=${[]}
                          body=${readoutBody(cells[selected], sel)}
                          byDateTotal=${(d) => (byDate[d] ? 1 : 0)} />`}
        </div>
`);
    }

    function UptimeArchive({ onUnauthorized }) {
      const [days, setDays] = useState(30);
      const [data, setData] = useState(() => uptimeOverviewMemo.get(30) || null);
      const [loading, setLoading] = useState(!uptimeOverviewMemo.has(30));
      const [error, setError] = useState(null);
      // Which cards a phone has opened. Held here, not in each card: a new
      // window shows a loading placeholder in place of the cards, and a card
      // that owned its own state would come back closed.
      const [openCards, setOpenCards] = useState(() => new Set());
      const toggleCard = (name) => setOpenCards((prev) => {
        const next = new Set(prev);
        if (next.has(name)) next.delete(name); else next.add(name);
        return next;
      });

      useEffect(() => {
        const cached = uptimeOverviewMemo.get(days);
        if (cached) { setData(cached); setLoading(false); }
        else { setData(null); setLoading(true); }
        setError(null);
        let alive = true;
        // The contract echoes `days`, so that's the request param; `since` rides
        // along so the window still works if the endpoint lands with
        // cost_overview's param name instead. Unknown params are ignored.
        const since = isoDaysAgo(days);
        api('/api/uptime_overview?days=' + days + '&since=' + since, 0)
          .then(d => { uptimeOverviewMemo.set(days, d); if (alive) { setData(d); setLoading(false); } })
          .catch(e => {
            if (!alive) return;
            if (e.message === 'unauthorized') { onUnauthorized && onUnauthorized(); return; }
            if (!cached) { setError(e.message); setLoading(false); }
          });
        return () => { alive = false; };
      }, [days]);

      const header = html`
        <div style="display: flex; justify-content: space-between; align-items: baseline;
                    flex-wrap: wrap; gap: 8px 12px; margin-bottom: 4px">
          <h2 style="margin: 0; font-size: 1.3rem">Uptime archive</h2>
          <${WindowPicker} days=${days} onChange=${setDays} />
        </div>
        <${PageNote}>
          <div style="font-size: 1.02rem; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5">
            What UptimeRobot saw, kept past its 3-month retention — one row per
            monitor per day, written by the same 8am cron. The 1d / 7d / 30d
            figures are its rolling ratios at the last pull, so they don't move
            with the window above; the strip and the trend do.
          </div>
        <//>`;

      const section = (children) => html`<div style="margin-top: 26px">${header}${children}</div>`;

      if (loading && !data) return section(html`<div class="cost-placeholder">Loading uptime archive…</div>`);

      if (error) {
        return section(html`
          <div class="cost-placeholder">
            Couldn't load the uptime archive (${error}). The live targets above are
            unaffected — they're polled directly, not read from this table.
          </div>`);
      }

      // The endpoint distinguishes "archive unreadable" from "archive empty"
      // and this must too. Both arrive as zero rows, and letting the failure
      // fall through to the empty state below would rebuild the #45 bug one
      // layer up from where it was fixed.
      if (data?.unavailable) {
        return section(html`
          <div class="cost-placeholder">
            <strong>Archive unreadable</strong> — the query against
            <code>uptime_daily</code> failed, so this is not "no data yet". The
            live targets above are unaffected; they're polled directly.
          </div>`);
      }

      const monitors = Array.isArray(data?.monitors) ? data.monitors : [];
      const effDays = Number(data?.days) > 0 ? Number(data.days) : days;
      const dates = [];
      for (let i = effDays - 1; i >= 0; i--) dates.push(isoDaysAgo(i));

      const seriesDates = new Set();
      for (const m of monitors) {
        for (const p of (Array.isArray(m.series) ? m.series : [])) {
          if (p && p.date) seriesDates.add(p.date);
        }
      }

      // Zero rows is the real state on day one and stays the state for a while
      // — say so, with the date collection started, rather than drawing an
      // empty chart that reads as an outage.
      if (!monitors.length || seriesDates.size === 0) {
        const since = data?.collecting_since
          || (data?.generated_at ? String(data.generated_at).slice(0, 10) : isoDaysAgo(0));
        const rest = (monitors.length
          ? `— ${monitors.length} monitor${monitors.length === 1 ? '' : 's'} registered, no archived days yet.`
          : '— no archived days yet.')
          + ' A row lands per monitor per day on the health cron\'s send path, so'
          + ' the first appears after its next run. Nothing is backfilled:'
          + ' UptimeRobot exposes rolling ratios, not per-day history, and an'
          + ' invented past would be worse than a short one.';
        return section(html`
          <div class="cost-placeholder">
            <strong>Collecting since ${fmtShortDate(since)}</strong> ${rest}
          </div>`);
      }

      const archivedDays = seriesDates.size;
      const ratios = monitors.map(m => Number(m.uptime_30d)).filter(Number.isFinite);
      const worst = ratios.length ? Math.min(...ratios) : null;
      const ranked = monitors
        .map(m => ({ name: m.name, ms: Number(m.avg_response_ms) }))
        .filter(r => Number.isFinite(r.ms) && r.ms > 0)
        .sort((a, b) => b.ms - a.ms);
      const slowest = ranked[0]?.ms || 1;

      // Built as one string, not interpolated across lines: htm trims the
      // whitespace around a newline inside static text, which glues the
      // separator to the next number ("· 30" -> "·30").
      const summary = `lowest 30d uptime · ${monitors.length} monitor${monitors.length === 1 ? '' : 's'}`
        + ` · ${archivedDays} day${archivedDays === 1 ? '' : 's'} archived`
        + (archivedDays < effDays ? ` (window shows ${effDays})` : '');

      const buckets = [
        ['var(--green)', 1, 'no downtime recorded', '≥ 99.9%'],
        ['var(--yellow)', 1, 'a check or two missed', '99 – 99.9%'],
        ['var(--red)', 1, 'real downtime', '< 99%'],
        [NO_DATA_COLOR, NO_DATA_OPACITY, 'not archived — a gap, not a zero', 'no row'],
      ];

      return section(html`
        <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; flex-wrap: wrap">
          <div style="font-size: 1.75rem; font-weight: 700;
                      color: ${worst == null ? 'var(--text-secondary)' : uptimeColor(worst)}">
            ${fmtPct(worst)}
          </div>
          <div style="font-size: 1.02rem; color: var(--text-secondary)">${summary}</div>
        </div>

        ${monitors.map(m => html`<${MonitorUptimeCard} key=${m.name} monitor=${m} dates=${dates} days=${effDays}
                                             open=${openCards.has(m.name)} onToggle=${() => toggleCard(m.name)} />`)}

        <div class="two-col">
          <!-- min-width: 0 on both tracks: monitor names are URLs, and a grid
               item's automatic minimum size would let one widen the track past
               the viewport (21px of horizontal page scroll at 375px). -->
          <div style="min-width: 0">
            <div style="font-size: 0.98rem; font-weight: 600; color: var(--text-secondary);
                        font-family: 'SF Mono', ui-monospace, monospace; text-transform: uppercase; margin-bottom: 8px">
              Reading the strip
            </div>
            ${buckets.map(([color, opacity, label, range]) => html`
              <div style="display: flex; align-items: center; gap: 8px; padding: 5px 0;
                          border-bottom: 1px solid var(--border)">
                <span style="width: 9px; height: 9px; border-radius: 2px; flex: none;
                             background: ${color}; opacity: ${opacity}"></span>
                <span style="font-size: 1.12rem">${label}</span>
                <span style="margin-left: auto; font-size: 0.85rem; color: var(--text-secondary);
                             font-family: 'SF Mono', ui-monospace, monospace">${range}</span>
              </div>`)}
          </div>

          <div style="min-width: 0">
            <div style="font-size: 0.98rem; font-weight: 600; color: var(--text-secondary);
                        font-family: 'SF Mono', ui-monospace, monospace; text-transform: uppercase; margin-bottom: 8px">
              Slowest to answer
            </div>
            ${ranked.length ? ranked.map(r => html`
              <div style="padding: 5px 0; border-bottom: 1px solid var(--border)">
                <div style="display: flex; align-items: center; gap: 8px">
                  <span style="font-size: 1.12rem; overflow: hidden; text-overflow: ellipsis;
                               white-space: nowrap">${r.name}</span>
                  <span style="margin-left: auto; font-size: 1.12rem; font-variant-numeric: tabular-nums">
                    ${fmtMs(r.ms)}
                  </span>
                </div>
                <div style="height: 3px; border-radius: 2px; margin-top: 3px; background: var(--accent);
                            opacity: 0.6; width: ${(r.ms / slowest * 100).toFixed(1)}%"></div>
              </div>`)
              : html`<div style="font-size: 1.02rem; color: var(--text-secondary)">
                  No response times archived yet.</div>`}
            <div style="font-size: 0.85rem; color: var(--text-secondary); padding-top: 6px; line-height: 1.5">
              Daily average of UptimeRobot's 5-minute checks — enough to see a
              trend move, not enough for latency percentiles.
            </div>
          </div>
        </div>

        <div style="margin-top: 12px; font-size: 0.95rem; color: var(--text-secondary); line-height: 1.5">
          Rows live in Turso's <code>uptime_daily</code> (cloud-direct, no sync leg)
          and are written by <code>web/api/health_report.py</code>'s send path only.
        </div>`);
    }

    // ---- Cost Chart (daily API spend per project) ----
    function CostChart({ project }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        // Memoized cost (instant on revisit), then revalidate in background.
        const cached = memo.cost.get(project);
        if (cached) { setData(cached); setLoading(false); }
        else { setData(null); setLoading(true); }
        // 30-day window. Backend grouping returns one row per (date, model).
        const since = labDay(30);
        let alive = true;
        api('/api/cost_timeline?project=' + encodeURIComponent(project)
            + '&since=' + since)
          .then(d => { memo.cost.set(project, d); if (alive) { setData(d); setLoading(false); } })
          .catch(e => { if (alive && !cached) { setData({ error: e.message }); setLoading(false); } });
        return () => { alive = false; };
      }, [project]);

      if (loading) return html`<div class="cost-placeholder">Loading cost…</div>`;
      if (!data || data.error) return null;
      // A continuous 30-day calendar like every other chart here, so a bar's
      // position is its date and the newest bar is always today. `since` is
      // inclusive and brings a 31st day; the header total and the legend count
      // only the days drawn, so "last 30d", the bars and the legend agree.
      const dates = [];
      for (let i = 29; i >= 0; i--) dates.push(labDay(i));
      const costs = (data.costs || []).filter((r) => r.date >= dates[0]);
      if (!costs.length) return html`
        <div class="cost-placeholder">
          No API spend in the last 30 days.
          <span style="opacity: 0.7">Claude Code (subscription) work isn't attributed per project.</span>
        </div>`;

      // Per-day, per-model spend. One colour for every model, as this chart has
      // always drawn it: the model split is in the tooltip, the readout and the
      // legend below, not in the bar.
      const byDateModel = {}, byModel = {};
      let total = 0;
      for (const r of costs) {
        const v = Number(r.cost_usd) || 0;
        total += v;
        (byDateModel[r.date] ||= {})[r.model] = (byDateModel[r.date]?.[r.model] || 0) + v;
        byModel[r.model] = (byModel[r.model] || 0) + v;
      }
      const models = Object.entries(byModel).sort((a, b) => b[1] - a[1]);

      return html`
        <div style="margin-top: 16px; padding: 12px; background: var(--bg-elevated);
                    border: 1px solid var(--border); border-radius: 6px">
          <div style="display: flex; justify-content: space-between; align-items: baseline;
                      margin-bottom: 12px">
            <div style="font-size: 0.93rem; font-weight: 600;
                        color: var(--text-secondary);
                        font-family: 'SF Mono', ui-monospace, monospace">
              API cost · last 30d
            </div>
            <div style="display: flex; align-items: baseline; gap: 12px">
              <div data-test="cost-total" style="font-size: 1.3rem; font-weight: 600">
                $${total.toFixed(2)}
              </div>
              <a class="tap" href="#/project/${encodeURIComponent(project)}/cost"
                 style="font-size: 0.95rem; color: var(--accent); text-decoration: none;
                        font-family: 'SF Mono', ui-monospace, monospace">
                details →
              </a>
            </div>
          </div>
          <${StackedBars} id="project-cost" dates=${dates} days=${30} byDateSeg=${byDateModel}
            segColor=${() => 'var(--accent)'} fmtValue=${fmtUsdFine} fmtAxis=${fmtUsdAxis}
            minPeak=${0.0001} chartH=${100} scroll=${false} />
          ${models.length > 0 && html`
            <div data-test="cost-legend" style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px;
                        font-size: 0.89rem; color: var(--text-secondary);
                        font-family: 'SF Mono', ui-monospace, monospace">
              ${models.map(([m, v]) => html`
                <span>${m}: $${v.toFixed(2)}</span>
              `)}
            </div>
          `}
        </div>
      `;
    }

    // ---- Cost Detail Page (per-day, per-model, per-token-type drill-down) ----
    function CostDetailPage({ project }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [days, setDays] = useState(30);
      const [sort, setSort] = useState({ col: 'date', dir: 'desc' });
      const [modelFilter, setModelFilter] = useState('all');
      const [tokenFilter, setTokenFilter] = useState('all');

      useEffect(() => {
        setLoading(true); setData(null);
        const since = labDay(days);
        api('/api/cost_timeline?detail=1&project=' + encodeURIComponent(project)
            + '&since=' + since)
          .then(d => { setData(d); setLoading(false); })
          .catch(e => { setData({ error: e.message }); setLoading(false); });
      }, [project, days]);

      if (loading) return html`<${SkeletonList} />`;
      if (data?.error) return html`<div class="error">${data.error}</div>`;
      const rows = (data?.detail || []).map(r => ({
        ...r, cost_usd: Number(r.cost_usd) || 0,
      }));

      // Filter dropdown options
      const models = ['all', ...new Set(rows.map(r => r.model))].sort();
      const tokens = ['all', ...new Set(rows.map(r => r.token_type).filter(Boolean))].sort();

      const filtered = rows.filter(r =>
        (modelFilter === 'all' || r.model === modelFilter)
        && (tokenFilter === 'all' || r.token_type === tokenFilter)
      );
      const sorted = [...filtered].sort((a, b) => {
        const va = a[sort.col], vb = b[sort.col];
        const cmp = (typeof va === 'number' && typeof vb === 'number')
          ? va - vb
          : String(va).localeCompare(String(vb));
        return sort.dir === 'asc' ? cmp : -cmp;
      });
      const total = sorted.reduce((s, r) => s + r.cost_usd, 0);

      const toggleSort = (col) => setSort(s =>
        s.col === col ? { col, dir: s.dir === 'asc' ? 'desc' : 'asc' }
                      : { col, dir: col === 'cost_usd' || col === 'date' ? 'desc' : 'asc' });
      const arrow = (col) => sort.col === col ? (sort.dir === 'asc' ? ' ↑' : ' ↓') : '';

      return html`
        <div>
          <div style="display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px">
            <a class="tap" href="#/project/${encodeURIComponent(project)}"
               style="color: var(--text-secondary); text-decoration: none; font-size: 1.16rem">
              ← ${project}
            </a>
            <h2 style="margin: 0; font-size: 1.57rem">Cost detail</h2>
            <div style="margin-left: auto; font-size: 1.3rem; font-weight: 600">
              $${total.toFixed(2)} <span style="font-weight: 400; color: var(--text-secondary);
                font-size: 1.02rem">(${sorted.length} rows)</span>
            </div>
          </div>

          <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
                      font-size: 1.06rem; align-items: center">
            <label>Window:
              <select value=${days} onChange=${e => setDays(Number(e.target.value))}
                      style="margin-left: 4px">
                <option value=${7}>7 days</option>
                <option value=${30}>30 days</option>
                <option value=${90}>90 days</option>
                <option value=${365}>1 year</option>
              </select>
            </label>
            <label>Model:
              <select value=${modelFilter} onChange=${e => setModelFilter(e.target.value)}
                      style="margin-left: 4px">
                ${models.map(m => html`<option value=${m}>${m}</option>`)}
              </select>
            </label>
            <label>Token type:
              <select value=${tokenFilter} onChange=${e => setTokenFilter(e.target.value)}
                      style="margin-left: 4px">
                ${tokens.map(t => html`<option value=${t}>${t || '(empty)'}</option>`)}
              </select>
            </label>
          </div>

          ${sorted.length === 0
            ? html`<div class="empty">No cost rows in this window.</div>`
            : html`
              <div style="overflow-x: auto; border: 1px solid var(--border); border-radius: 6px">
                <table style="width: 100%; border-collapse: collapse; font-size: 1.06rem;
                              font-family: 'SF Mono', ui-monospace, monospace">
                  <thead>
                    <tr style="background: var(--bg-elevated); text-align: left">
                      ${[
                        ['date', 'Date'],
                        ['model', 'Model'],
                        ['token_type', 'Token type'],
                        ['service_tier', 'Tier'],
                        ['context_window', 'Context'],
                        ['cost_usd', 'Cost'],
                      ].map(([col, label]) => html`
                        <th style="padding: 6px 10px; cursor: pointer;
                                   border-bottom: 1px solid var(--border);
                                   text-align: ${col === 'cost_usd' ? 'right' : 'left'};
                                   white-space: nowrap"
                            onClick=${() => toggleSort(col)}>
                          ${label}${arrow(col)}
                        </th>
                      `)}
                    </tr>
                  </thead>
                  <tbody>
                    ${sorted.map(r => html`
                      <tr style="border-bottom: 1px solid var(--border)">
                        <td style="padding: 5px 10px; white-space: nowrap">${r.date}</td>
                        <td style="padding: 5px 10px">${r.model}</td>
                        <td style="padding: 5px 10px; color: var(--text-secondary)">${r.token_type || '—'}</td>
                        <td style="padding: 5px 10px; color: var(--text-secondary)">${r.service_tier || '—'}</td>
                        <td style="padding: 5px 10px; color: var(--text-secondary)">${r.context_window || '—'}</td>
                        <td style="padding: 5px 10px; text-align: right">$${r.cost_usd.toFixed(4)}</td>
                      </tr>
                    `)}
                  </tbody>
                </table>
              </div>
            `}
        </div>
      `;
    }

    // ---- Project Page ----
    // ---- Project metadata editor (issue #23) ----
    // `private` is cosmetic only: it mutes and hides the project in this UI.
    // It is NOT a confidentiality control — readers still get every field from
    // the API. Real per-user access control is Garm (#24).
    const CATEGORIES = ['Music', 'Art', 'Collabs', 'Tools', 'Other'];

    function MetadataEditor({ project, meta, role, onMetaChange }) {
      const [saving, setSaving] = useState(false);
      const [flash, setFlash] = useState(null);
      const readOnly = role !== 'admin';

      const save = async (fields) => {
        setSaving(true); setFlash(null);
        try {
          const res = await fetch('/api/project_metadata', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ project, ...fields }),
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'save failed');
          const d = await res.json();
          onMetaChange(d.project, d.metadata);
          setFlash({ ok: true, msg: 'saved' });
        } catch (e) {
          setFlash({ ok: false, msg: e.message });
        }
        setSaving(false);
      };

      return html`
        <div class="meta-editor">
          <select disabled=${readOnly || saving} value=${meta.status}
            onChange=${(e) => save({ status: e.target.value })}>
            <option value="active">active</option>
            <option value="dormant">dormant</option>
          </select>
          <select disabled=${readOnly || saving} value=${meta.category || ''}
            onChange=${(e) => save({ category: e.target.value || null })}>
            <option value="">no category</option>
            ${CATEGORIES.map(c => html`<option value=${c}>${c}</option>`)}
          </select>
          <label title="Cosmetic only — hides and mutes this project in the dashboard. Not a confidentiality control.">
            <input type="checkbox" disabled=${readOnly || saving} checked=${meta.private}
              onChange=${(e) => save({ private: e.target.checked })} />
            private
          </label>
          ${flash && html`<span class=${flash.ok ? 'meta-saved' : 'meta-error'}>${flash.msg}</span>`}
        </div>
      `;
    }

    function ProjectPage({ name, overview, section, role, onMetaChange }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [summaryOpen, setSummaryOpen] = useState(false);

      useEffect(() => {
        setSummaryOpen(false);
        // Show memoized data instantly (instant back-nav / prefetch hit), then
        // revalidate in the background; only show the skeleton on a cold miss.
        const cached = memo.project.get(name);
        if (cached) { setData(cached); setLoading(false); }
        else { setData(null); setLoading(true); }
        let alive = true;
        api('/api/project?name=' + encodeURIComponent(name))
          .then(d => { memo.project.set(name, d); if (alive) { setData(d); setLoading(false); } })
          .catch(e => { if (alive && !cached) { setData({ error: e.message, status: e.status }); setLoading(false); } });
        return () => { alive = false; };
      }, [name]);

      if (data?.status === 403) return html`<p style="color: var(--text-secondary); padding: 24px 0">This project isn't in your view.</p>`;

      if (section === 'cost') return html`<${CostDetailPage} project=${name} />`;

      if (loading) return html`<${SkeletonList} />`;

      if (data?.error) return html`<div class="error">${data.error}</div>`;
      if (!data) return null;

      const snapshot = data.snapshot || {};
      const githubUrl = snapshot.github_url;
      const siteUrl = snapshot.site_url;
      const inception = data.inception;

      // Hide site link if it points to the page we're currently on (self-link
      // for the cloud dashboard itself). For other projects, show the URL's
      // host as the link label instead of the generic "Site".
      let siteLabel = null;
      if (siteUrl) {
        try {
          const u = new URL(siteUrl);
          if (u.host !== window.location.host) {
            siteLabel = u.host.replace(/^www\./, '');
          }
        } catch { /* malformed URL — skip */ }
      }

      const stateSummary = snapshot.state_summary || data.summaries?.[0]?.summary || null;
      const teaser = stateSummary
        ? stateSummary.split(/(?<=[.!?])\s+/)[0]
        : null;
      const hasMore = stateSummary && teaser && stateSummary.length > teaser.length;

      // No metadata row yet = the defaults, so the editor renders either way.
      const meta = {
        category: null, private: false, status: 'active',
        ...(overview?.project_metadata?.[name] || {}),
      };

      return html`
        <div>
          <div class="project-header">
            <div class="project-title-row">
              <span class="project-name ${meta.private ? 'is-private' : ''}">${name}</span>
              ${meta.private && html`<span class="badge badge-private">private</span>`}
              ${meta.category && html`<span class="badge">${meta.category}</span>`}
              <div class="project-links">
                ${githubUrl && html`<a class="project-link" style="flex: none" href=${githubUrl} target="_blank" rel="noopener">GitHub</a>`}
                ${siteLabel && html`<a class="project-link" href=${siteUrl} target="_blank" rel="noopener">${siteLabel}</a>`}
              </div>
            </div>
            <${MetadataEditor} project=${name} meta=${meta} role=${role} onMetaChange=${onMetaChange} />
          </div>

          <div class="section-label">Now</div>
          <div class="project-meta">
            ${inception && html`<span>Since ${inception}</span>`}
            ${inception && (snapshot.session_count_7d || snapshot.commit_count_7d) && html`<span> · </span>`}
            ${snapshot.session_count_7d ? html`<span>${snapshot.session_count_7d} sessions</span>` : null}
            ${snapshot.commit_count_7d ? html`<span> · ${snapshot.commit_count_7d} commits (7d)</span>` : null}
          </div>
          ${stateSummary
            ? html`
              <div class="project-summary" style="cursor: ${hasMore ? 'pointer' : 'default'}"
                   onClick=${() => hasMore && setSummaryOpen(v => !v)}>
                <${MachineText}>
                  ${summaryOpen ? stateSummary : teaser}
                  ${hasMore && html`<span style="margin-left: 6px">${summaryOpen ? '⌃' : '⌄'}</span>`}
                <//>
              </div>
            `
            : html`<div class="project-summary">No state summary yet.</div>`}

          <div class="section-label">Trajectory</div>
          <${ActivityHeatmap} activity=${data.activity} />

          <div class="section-label">Cost</div>
          <${CostChart} project=${name} />

          <div class="section-label">History</div>
          <${TimelineView} data=${data} />
        </div>
      `;
    }

    // ---- Timeline View (vertical line with expandable entries) ----
    function TimelineView({ data }) {
      const { summaries, rollups } = data;
      const [expanded, setExpanded] = useState({});
      const [showAll, setShowAll] = useState(false);

      const toggle = (id) => setExpanded(p => ({ ...p, [id]: !p[id] }));

      // Build timeline items sorted by date desc
      const allItems = [];
      for (const s of summaries) {
        const decisions = tryParseJson(s.key_decisions);
        const phrase = decisions.length > 0
          ? decisions[0]
          : (s.summary || '').split(' ').slice(0, 10).join(' ') + ((s.summary || '').split(' ').length > 10 ? '...' : '');
        allItems.push({ type: 'summary', id: 's-' + s.date, date: s.date, phrase, decisions, data: s });
      }
      for (const r of rollups) {
        allItems.push({ type: 'rollup', id: 'r-' + r.week_start, date: r.week_start, data: r });
      }
      allItems.sort((a, b) => b.date.localeCompare(a.date));

      if (allItems.length === 0) return html`<div class="empty">No activity recorded yet.</div>`;

      const TIMELINE_CAP = 8;
      const items = showAll ? allItems : allItems.slice(0, TIMELINE_CAP);
      const hiddenCount = allItems.length - items.length;

      // Group by date
      const groups = [];
      let currentDate = null;
      for (const item of items) {
        if (item.date !== currentDate) {
          currentDate = item.date;
          groups.push({ date: currentDate, items: [] });
        }
        groups[groups.length - 1].items.push(item);
      }

      return html`
        <div class="timeline">
          ${groups.map(g => html`
            <div class="timeline-date">${g.date}</div>
            ${g.items.map(item => {
              if (item.type === 'summary') {
                const isOpen = expanded[item.id];
                const s = item.data;
                return html`
                  <div class="timeline-entry" onClick=${() => toggle(item.id)}>
                    <span class="timeline-phrase">${item.phrase}</span>
                    ${isOpen && html`
                      <div class="timeline-expand">
                        <div class="timeline-expand-summary"><${MachineText}>${s.summary}<//></div>
                        ${item.decisions.length > 0 && html`
                          <ul class="timeline-expand-decisions">
                            ${item.decisions.map(d => html`<li>${d}</li>`)}
                          </ul>
                        `}
                        <div class="timeline-expand-counts">
                          <span><strong>${s.prompt_count || 0}</strong> prompts</span>
                          <span><strong>${s.session_count || 0}</strong> sessions</span>
                          <span><strong>${s.commit_count || 0}</strong> commits</span>
                        </div>
                      </div>
                    `}
                  </div>
                `;
              }
              if (item.type === 'rollup') {
                const isOpen = expanded[item.id];
                const r = item.data;
                const highlights = tryParseJson(r.highlights);
                const teaser = (r.narrative || '').split(/(?<=[.!?])\s+/)[0];
                return html`
                  <div class="timeline-entry rollup" onClick=${() => toggle(item.id)}>
                    <span class="timeline-rollup-label">Week of ${r.week_start}</span>
                    <span class="timeline-phrase" style="margin-left: 6px">
                      ${isOpen ? html`<${MachineText}>${r.narrative}<//>` : teaser}
                    </span>
                    ${isOpen && highlights.length > 0 && html`
                      <div class="card-tags" style="margin-top: 6px">
                        ${highlights.map(h => html`<span class="tag">${h}</span>`)}
                      </div>
                    `}
                  </div>
                `;
              }
            })}
          `)}
          ${hiddenCount > 0 && html`
            <button class="tap" onClick=${() => setShowAll(true)}
                    style="margin-top: 12px; padding: 6px 12px;
                           background: transparent;
                           border: 1px solid var(--border);
                           color: var(--text-secondary);
                           border-radius: 4px; cursor: pointer;
                           font-size: 1.02rem;
                           font-family: 'SF Mono', ui-monospace, monospace">
              Show ${hiddenCount} more
            </button>
          `}
          ${showAll && allItems.length > TIMELINE_CAP && html`
            <button class="tap" onClick=${() => setShowAll(false)}
                    style="margin-top: 12px; padding: 6px 12px;
                           background: transparent;
                           border: 1px solid var(--border);
                           color: var(--text-secondary);
                           border-radius: 4px; cursor: pointer;
                           font-size: 1.02rem;
                           font-family: 'SF Mono', ui-monospace, monospace">
              Show less
            </button>
          `}
        </div>
      `;
    }

    // ---- Ask Modal ----
    function AskModal({ overview, project, onClose }) {
      const [question, setQuestion] = useState('');
      const [answer, setAnswer] = useState(null);
      const [asking, setAsking] = useState(false);
      const [error, setError] = useState(null);
      const [showHistory, setShowHistory] = useState(false);
      const [copied, setCopied] = useState(false);
      const inputRef = useRef(null);

      // Persist ask history in localStorage
      const historyKey = 'promptlab_ask_history';
      const getHistory = () => {
        try { return JSON.parse(localStorage.getItem(historyKey) || '[]'); } catch { return []; }
      };
      const saveToHistory = (q, a) => {
        const h = getHistory();
        h.unshift({ q, a, date: labStamp(), project: project || 'all' });
        if (h.length > 20) h.length = 20; // keep last 20
        localStorage.setItem(historyKey, JSON.stringify(h));
      };
      const copyAnswer = () => {
        if (answer) {
          navigator.clipboard.writeText(answer);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      useEffect(() => { inputRef.current?.focus(); }, []);

      const handleAsk = async () => {
        if (!question.trim()) return;
        setAsking(true); setError(null); setAnswer(null);

        const bp = overview.by_project || {};
        const allSummaries = [];

        // Scope to project if specified
        const projects = project ? [project] : Object.keys(bp);
        for (const p of projects) {
          for (const s of (bp[p]?.summaries || []))
            allSummaries.push('[' + s.date + '] ' + p + ': ' + s.summary);
        }

        const ctx = [
          project ? '== ' + project + ' summaries (last 7 days) ==' : '== Daily summaries (last 7 days) ==',
          ...allSummaries.slice(0, 30),
        ].join('\n');

        try {
          const result = await apiPost('/api/ask', { question: question.trim(), context: ctx });
          if (result.error) throw new Error(result.error);
          setAnswer(result.answer);
          saveToHistory(question.trim(), result.answer);
        } catch (e) { setError(e.message); }
        setAsking(false);
      };

      const setQ = (q) => { setQuestion(q); setTimeout(() => inputRef.current?.focus(), 0); };

      const examples = project ? [
        'What did I do this week?',
        'What decisions were made recently?',
        'What should I focus on next?',
      ] : [
        'What did I work on this week?',
        'Which project needs attention?',
        'Summarize this week across projects',
      ];

      return html`
        <div class="ask-overlay" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div class="ask-modal">
            <div class="ask-modal-title">${project ? 'Ask about ' + project : 'Ask about your work'}</div>
            ${!answer && !asking && html`
              <div class="ask-examples">
                ${examples.map(q => html`
                  <button class="ask-example" onClick=${() => setQ(q)}>${q}</button>
                `)}
              </div>
            `}
            <div class="ask-input-row">
              <input class="ask-input" ref=${inputRef} type="text"
                placeholder="Ask anything..."
                value=${question} onInput=${e => setQuestion(e.target.value)}
                onKeyDown=${e => { if (e.key === 'Enter') handleAsk(); if (e.key === 'Escape') onClose(); }}
                disabled=${asking} />
              <button class="ask-btn" onClick=${handleAsk} disabled=${asking || !question.trim()}>
                ${asking ? '...' : 'Ask'}
              </button>
            </div>
            ${asking && html`
              <div style="padding: 14px; color: var(--text-secondary); font-size: 1.12rem; display: flex; align-items: center; gap: 8px">
                <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite"></span>
                Thinking...
              </div>
            `}
            ${error && html`<div class="error" style="padding: 8px">${error}</div>`}
            ${answer && html`
              <div class="ask-answer">${answer}</div>
              <button style="font-size: 0.98rem; color: var(--accent-light); background: none;
                border: none; cursor: pointer; margin-top: 6px; padding: 0; font-family: inherit"
                onClick=${copyAnswer}>${copied ? 'Copied' : 'Copy response'}</button>
            `}

            ${!asking && !answer && html`
              <button style="font-size: 0.98rem; color: var(--text-secondary); background: none;
                border: none; cursor: pointer; margin-top: 4px; padding: 0; font-family: inherit"
                onClick=${() => setShowHistory(!showHistory)}>
                ${showHistory ? 'Hide' : 'Show'} previous asks
              </button>
            `}
            ${showHistory && html`
              <div style="margin-top: 10px; max-height: 40vh; overflow-y: auto">
                ${getHistory().map(h => html`
                  <div style="border-bottom: 1px solid var(--border); padding: 8px 0">
                    <div style="font-size: 1.02rem; color: var(--text); font-weight: 600; margin-bottom: 4px">
                      ${h.q}
                      <span style="font-weight: 400; color: var(--text-secondary); margin-left: 6px;
                        font-family: 'SF Mono', ui-monospace, monospace; font-size: 0.89rem">
                        ${h.date}${h.project !== 'all' ? ' · ' + h.project : ''}
                      </span>
                    </div>
                    <div style="font-size: 1.02rem; color: var(--text-secondary); line-height: 1.5; white-space: pre-wrap">
                      ${(h.a || '').slice(0, 300)}${(h.a || '').length > 300 ? '...' : ''}
                    </div>
                  </div>
                `)}
                ${getHistory().length === 0 && html`
                  <div style="font-size: 1.02rem; color: var(--text-secondary); padding: 8px 0">No previous asks.</div>
                `}
              </div>
            `}
          </div>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
