name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff==0.15.22'  # pinned: an unpinned install broke CI 2026-07-29 (new ruff, 339 new-rule errors)
          pip install -r requirements.txt
          pip install -r web/requirements.txt

      - name: Ruff (lint)
        run: ruff check . --exclude .venv

      - name: Import smoke check
        run: python scripts/test_imports.py

      - name: Alias layer smoke tests
        run: python scripts/test_alias_layer.py

      - name: Session identity tests
        run: python scripts/test_session_identity.py

      - name: Readup and whole-day workflow tests
        run: |
          python scripts/test_readup_checks.py
          python scripts/test_public_allowlist.py
          python scripts/test_day_context.py
          python scripts/test_workflow_roundtrip.py
          python scripts/test_lean_nightly.py
          python scripts/test_synthesizer_outcome.py
          python scripts/test_readup_md_structure.py
          python scripts/test_handoff_md_structure.py
          python scripts/test_paid_artifacts.py
          python scripts/test_sync_clobber.py
          python scripts/test_sync_failures.py

      - name: Codex prompt installation tests
        run: python scripts/test_install_codex_prompts.py

      - name: Cost pipeline smoke tests
        run: python scripts/test_cost_pipeline.py

      - name: Web API unit tests
        run: python scripts/test_web_api.py

      - name: Public draft/publish tests
        run: python scripts/test_public_draft.py

      - name: Heartbeat tests
        run: python scripts/test_heartbeat.py

      - name: Commits dedup tests
        run: python scripts/test_dedup_commits.py

      - name: Nightly pipeline tests
        run: |
          python scripts/test_send_review.py
          python scripts/test_nightly_pipeline.py

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv (required by Vercel's Python builder)
        uses: astral-sh/setup-uv@v3

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
