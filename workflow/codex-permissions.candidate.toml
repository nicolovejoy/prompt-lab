# Candidate only: not installed or selected by work.zsh/install.sh.
# Use env.tpl / env.example for references and placeholders; .env* is denied.
# Profiles cover command execution, not approved escalation or external tools.
#
# Reads stay open by default (no ":root" = "deny"): denying the root breaks git
# (~/.gitconfig), node (OpenSSL config) and gh, and it silently disables the
# exact-path .git carve-outs below. Secrets are protected by explicit denies.
default_permissions = "prompt-lab"
approval_policy = "on-request"

[permissions.prompt-lab]
extends = ":workspace"

[permissions.prompt-lab.filesystem]
# gh needs these two to know which host and account it is acting as; the
# directory itself is denied below, so this is an exact-path carve-out, not
# an opening. Safe only while `gh auth status` reports (keyring) — gh then
# keeps the token in the macOS keychain and hosts.yml holds no credential.
# If gh ever falls back to file storage, this grant becomes a token grant.
"~/.config/gh/config.yml" = "read"
"~/.config/gh/hosts.yml" = "read"
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.config/gcloud" = "deny"
"~/.config/gh" = "deny"
"~/.codex/auth.json" = "deny"
"~/.netrc" = "deny"
"~/.npmrc" = "deny"
"~/.appstoreconnect" = "deny"
# 1Password desktop-app integration socket: sandboxed `op` must never reach it.
# (1Password also rejects sandboxed callers today; this makes it structural.)
"~/Library/Group Containers/2BUA8C4S2C.com.1password" = "deny"
# Raw prompts: reachable only through the reviewed gc-read/gc-write helpers.
"~/.claude/prompt-history.db" = "deny"
"~/.claude/prompt-history.db-wal" = "deny"
"~/.claude/prompt-history.db-shm" = "deny"

[permissions.prompt-lab.filesystem.":workspace_roots"]
"**/.[eE][nN][vV]*" = "deny"
"**/*.[eE][nN][vV]" = "deny"
"**/*.[eE][nN][vV].*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
# A custom profile does not inherit :workspace's protected paths. Reopen .git
# for local commits, but keep hooks and config read-only: a planted hook would
# later run outside the sandbox. .codex/.agents hold Codex's own project config
# and skills, so the sandbox must not rewrite them.
".git" = "write"
".git/hooks" = "read"
".git/config" = "read"
".codex" = "read"
".agents" = "read"

[permissions.prompt-lab.network]
enabled = true
